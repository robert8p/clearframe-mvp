name: Apply prepared stakeholder hardening tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-stakeholder-tree.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Commit prepared tree to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.sha }}
          TREE_SHA: 74640cc159058ff61d12ac53e527f4950099bf49
        run: |
          set -euo pipefail
          commit_response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/commits" \
            -d "$(jq -n --arg message 'Apply full stakeholder review and product hardening' --arg tree "$TREE_SHA" --arg parent "$PARENT_SHA" '{message:$message,tree:$tree,parents:[$parent]}')")
          commit_sha=$(printf '%s' "$commit_response" | jq -r '.sha')
          test -n "$commit_sha" && test "$commit_sha" != "null"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/main" \
            -d "$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')"
          echo "Applied prepared tree as ${commit_sha}"
