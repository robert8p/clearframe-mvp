name: Cogni Expo build status
on:
  push:
    branches: [release/cogni-0.4.3]
    paths: [.github/workflows/cogni-expo-build-status.yml]
  workflow_dispatch:
    inputs:
      build_id:
        description: Expo build UUID to inspect (read-only)
        type: string
        default: f49ef649-48eb-49ef-aed1-a1b59a3c62b8
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 155aa5be400412a043dfb37947bb6ff1f24da4fd
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: mobile/package-lock.json
    - name: Install locked project context
      run: npm ci --include=dev --no-audit --no-fund
    - name: Inspect build status without changing credentials or starting builds
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        BUILD_ID: ${{ inputs.build_id || 'f49ef649-48eb-49ef-aed1-a1b59a3c62b8' }}
      run: |
        set -euo pipefail
        node -e 'if(!/^[0-9a-f-]{36}$/.test(process.env.BUILD_ID))process.exit(1)'
        if ! npx --yes eas-cli@21.7.1 build:view "$BUILD_ID" --json > /tmp/expo-build.json; then
          cat /tmp/expo-build.json
          exit 1
        fi
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        b=json.loads(Path('/tmp/expo-build.json').read_text())
        assert b['id']==os.environ['BUILD_ID']
        fields=['id','status','platform','distribution','appVersion','appBuildVersion','gitCommitHash','createdAt','updatedAt','completedAt','error']
        result={key:b[key] for key in fields if key in b}
        result['buildPage']='https://expo.dev/accounts/cogniapp/projects/cogni/builds/'+b['id']
        result['downloadUrl']=(b.get('artifacts') or {}).get('buildUrl')
        result['sourceMatchesCogni043']=b.get('gitCommitHash')=='155aa5be400412a043dfb37947bb6ff1f24da4fd'
        Path('/tmp/cogni-expo-status.json').write_text(json.dumps(result,indent=2))
        print(json.dumps(result,indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Expo build status\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: cogni-expo-build-status-${{ github.run_attempt }}
        path: /tmp/cogni-expo-status.json
        if-no-files-found: error
        retention-days: 30
