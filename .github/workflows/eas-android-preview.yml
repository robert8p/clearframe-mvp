name: EAS Android preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-android-preview.yml"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Strict mobile dependency install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: ESLint
        run: npm run lint

      - name: UI quality audit
        run: npm run ui-audit

      - name: Logic and security audit
        run: npm run logic-audit

      - name: TypeScript check
        run: npm run typecheck

      - name: Supabase Edge typecheck
        working-directory: .
        run: deno check --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/index.ts

      - name: Context engine behavioral tests
        working-directory: .
        run: deno test --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/engine_test.ts

      - name: Verify Expo project link and hotfix version
        run: |
          node -e 'const c=require("./app.json"); const id=c.expo?.extra?.eas?.projectId; if(id!=="24fc0fea-5e66-4365-a82c-ac668aded7d0"){console.error(`Unexpected EAS project ID: ${id}`); process.exit(1)} if(c.expo?.version!=="0.3.1"){console.error(`Unexpected Cogni version: ${c.expo?.version}`); process.exit(1)} console.log(`Linked EAS project: ${id}; Cogni ${c.expo.version}`)'

      - name: Build and await installable Android hotfix
        run: npx eas-cli@21.7.1 build --platform android --profile preview --non-interactive
