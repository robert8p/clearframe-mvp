name: Cogni 0.4.3 Expo Android and iPhone previews
'on':
  push:
    branches: [release/cogni-0.4.3]
    paths: [.github/workflows/cogni-043-expo-cloud.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cogni-043-expo-cloud
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 155aa5be400412a043dfb37947bb6ff1f24da4fd
  SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
  SUPABASE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
  EXPO_PUBLIC_SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
  CI: '1'
jobs:
  cloud:
    if: github.ref == 'refs/heads/release/cogni-0.4.3'
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      APK_PATH: /tmp/cogni-0.4.3-artifact/Cogni-0.4.3-preview.apk
      PREVIOUS_APK_PATH: /tmp/cogni-upgrade/Cogni-0.4.2-preview.apk
      API_LEVEL: '36'
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 155aa5be400412a043dfb37947bb6ff1f24da4fd
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: mobile/package-lock.json
    - name: Validate pinned source and schema-safe preview settings
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
        git diff --exit-code
        npm ci --include=dev --no-audit --no-fund
        node - <<'NODE'
        const fs = require('node:fs');
        const assert = require('node:assert/strict');
        const app = require('./app.json').expo;
        assert.equal(app.version, '0.4.3');
        assert.equal(app.android.package, 'app.gocogni.cogni');
        assert.equal(app.ios.bundleIdentifier, 'app.gocogni.cogni');
        assert.equal(app.extra.eas.projectId, '24fc0fea-5e66-4365-a82c-ac668aded7d0');
        const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
        const profile = config.build.preview;
        const purchases = fs.readFileSync('lib/purchases.ts', 'utf8');
        // EAS requires nonempty strings. Cogni trims keys before deciding
        // whether purchases are available. Explicit whitespace preserves the
        // tested no-store preview without inheriting remote billing keys.
        const disabledKey = ' ';
        for (const name of ['APPLE', 'GOOGLE']) {
          assert(purchases.includes(`process.env.EXPO_PUBLIC_REVENUECAT_${name}_API_KEY?.trim() ?? ""`));
        }
        assert.equal(disabledKey.trim(), '');
        profile.credentialsSource = 'remote';
        profile.autoIncrement = true;
        profile.cache = {disabled: true};
        profile.env = {...profile.env,
          EXPO_PUBLIC_SUPABASE_URL: process.env.EXPO_PUBLIC_SUPABASE_URL,
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY: disabledKey,
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY: disabledKey};
        for (const [name, value] of Object.entries(profile.env)) {
          assert(typeof value === 'string' && value.length > 0, `Invalid environment value: ${name}`);
        }
        fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
        console.log('Exact Cogni 0.4.3 source and disabled purchase configuration verified.');
        NODE
        git diff --exit-code -- app lib components plugins package.json package-lock.json
        mkdir -p /tmp/cogni-expo-$BUILD_PLATFORM
    - name: Request signed Expo preview
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        set -euo pipefail
        test -n "$EXPO_TOKEN"
        npx eas-cli@21.7.1 whoami
        npx eas-cli@21.7.1 build --platform "$BUILD_PLATFORM" --profile preview --non-interactive --no-wait --json > /tmp/cogni-expo-$BUILD_PLATFORM/request.json
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        root=Path('/tmp/cogni-expo-'+os.environ['BUILD_PLATFORM'])
        raw=json.loads((root/'request.json').read_text())
        items=raw if isinstance(raw,list) else [raw]
        assert len(items)==1
        b=items[0]
        assert re.fullmatch(r'[0-9a-f-]{36}',b['id'])
        assert b['platform'].lower()==os.environ['BUILD_PLATFORM']
        assert b['gitCommitHash']==os.environ['SOURCE_COMMIT']
        page='https://expo.dev/accounts/cogniapp/projects/cogni/builds/'+b['id']
        with open(os.environ['GITHUB_ENV'],'a') as f: f.write('EAS_BUILD_ID='+b['id']+'\n')
        summary={'id':b['id'],'platform':b['platform'],'sourceCommit':b['gitCommitHash'],'buildPage':page}
        (root/'request-summary.json').write_text(json.dumps(summary,indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Expo preview requested: '+page+'\n')
        print(json.dumps(summary,indent=2))
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: cogni-043-expo-${{ matrix.platform }}-request-${{ github.run_attempt }}
        path: /tmp/cogni-expo-${{ matrix.platform }}/request-summary.json
        if-no-files-found: error
        retention-days: 30
    - name: Verify cloud completion and retrieve exact binary
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        set -euo pipefail
        for attempt in $(seq 1 160); do
          npx eas-cli@21.7.1 build:view "$EAS_BUILD_ID" --json > /tmp/cogni-expo-$BUILD_PLATFORM/build.json
          STATUS=$(python3 -c 'import json,os; print(json.load(open("/tmp/cogni-expo-"+os.environ["BUILD_PLATFORM"]+"/build.json"))["status"])')
          echo "Expo $BUILD_PLATFORM status: $STATUS"
          if [ "$STATUS" = FINISHED ]; then break; fi
          if [ "$STATUS" = ERRORED ] || [ "$STATUS" = CANCELED ]; then
            python3 -c 'import json,os; b=json.load(open("/tmp/cogni-expo-"+os.environ["BUILD_PLATFORM"]+"/build.json")); print(b.get("error",{}))'
            exit 1
          fi
          sleep 30
        done
        test "$STATUS" = FINISHED
        python3 - <<'PY'
        import json, os, urllib.request
        from pathlib import Path
        from urllib.parse import urlparse
        root=Path('/tmp/cogni-expo-'+os.environ['BUILD_PLATFORM'])
        b=json.loads((root/'build.json').read_text())
        assert b['id']==os.environ['EAS_BUILD_ID']
        assert b['gitCommitHash']==os.environ['SOURCE_COMMIT']
        assert b['appVersion']=='0.4.3' and b['distribution']=='INTERNAL'
        url=b['artifacts']['buildUrl']; parsed=urlparse(url)
        assert parsed.scheme=='https' and (parsed.hostname=='expo.dev' or parsed.hostname.endswith('.expo.dev'))
        name='Cogni-0.4.3-preview.'+('apk' if os.environ['BUILD_PLATFORM']=='android' else 'ipa')
        with urllib.request.urlopen(url,timeout=180) as response, (root/name).open('wb') as target:
            while chunk:=response.read(1024*1024): target.write(chunk)
        print('Downloaded completed Expo binary:',name)
        PY
    - uses: android-actions/setup-android@v3
      if: matrix.platform == 'android'
    - name: Verify Android identity, signing, permissions and bundle
      if: matrix.platform == 'android'
      run: |
        set -euo pipefail
        OUT=/tmp/cogni-0.4.3-artifact
        mkdir -p "$OUT"
        cp /tmp/cogni-expo-android/Cogni-0.4.3-preview.apk "$APK_PATH"
        unzip -t "$APK_PATH" >/dev/null
        unzip -Z1 "$APK_PATH" > /tmp/apk-files.txt
        AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
        ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
        "$AAPT" dump badging "$APK_PATH" > "$OUT/apk-badging.txt"
        "$AAPT" dump permissions "$APK_PATH" > "$OUT/apk-permissions.txt"
        "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > "$OUT/apk-signature.txt"
        "$ZIPALIGN" -c -P 16 4 "$APK_PATH"
        grep -q "package: name='app.gocogni.cogni'" "$OUT/apk-badging.txt"
        grep -q "versionName='0.4.3'" "$OUT/apk-badging.txt"
        grep -q "application-label:'Cogni'" "$OUT/apk-badging.txt"
        grep -q "targetSdkVersion:'36'" "$OUT/apk-badging.txt"
        VERSION_CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" "$OUT/apk-badging.txt" | head -1)
        test "$VERSION_CODE" -gt 61
        grep -q 'android.permission.INTERNET' "$OUT/apk-permissions.txt"
        grep -q 'com.android.vending.BILLING' "$OUT/apk-permissions.txt"
        for permission in SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE RECORD_AUDIO; do
          ! grep -q "android.permission.$permission" "$OUT/apk-permissions.txt"
        done
        grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/apk-signature.txt"
        tr -d ':' < "$OUT/apk-signature.txt" | tr '[:upper:]' '[:lower:]' > /tmp/signer-normalized.txt
        grep -q 'e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e' /tmp/signer-normalized.txt
        grep -q '^lib/x86_64/' /tmp/apk-files.txt
        grep -q '^lib/arm64-v8a/' /tmp/apk-files.txt
        BUNDLE_PATH=$(awk '/(^|\/)index\.android\.bundle$/{print; exit}' /tmp/apk-files.txt)
        test -n "$BUNDLE_PATH"
        unzip -p "$APK_PATH" "$BUNDLE_PATH" > /tmp/index.android.bundle
        strings -a /tmp/index.android.bundle > /tmp/index.android.strings.txt
        grep -Fq "$EXPO_PUBLIC_SUPABASE_URL" /tmp/index.android.strings.txt
        grep -Fq "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" /tmp/index.android.strings.txt
        for name in SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY REVENUECAT_SECRET_API_KEY REVENUECAT_WEBHOOK_HMAC_SECRET REVENUECAT_WEBHOOK_AUTHORIZATION; do
          ! grep -Fq "$name" /tmp/index.android.strings.txt
        done
        SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
        printf '{"version":"0.4.3","versionCode":"%s","sha256":"%s","sourceCommit":"%s","revenueCatStoreKeys":"disabled_for_prestore_gate"}\n' "$VERSION_CODE" "$SHA256" "$SOURCE_COMMIT" > "$OUT/metadata.json"
        echo "Verified versionCode=$VERSION_CODE sha256=$SHA256 source=$SOURCE_COMMIT"
    - name: Verify signed iPhone device archive
      if: matrix.platform == 'ios'
      run: |
        python3 - <<'PY'
        import hashlib,json,plistlib,os,re,time
        from pathlib import Path
        from zipfile import ZipFile
        root=Path('/tmp/cogni-expo-ios'); ipa=root/'Cogni-0.4.3-preview.ipa'
        with ZipFile(ipa) as archive:
            infos=[n for n in archive.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info.plist',n)]
            assert len(infos)==1
            app=infos[0].removesuffix('Info.plist'); info=plistlib.loads(archive.read(infos[0]))
            assert info['CFBundleIdentifier']=='app.gocogni.cogni'
            assert info['CFBundleShortVersionString']=='0.4.3'
            assert app+'_CodeSignature/CodeResources' in archive.namelist()
            provision=archive.read(app+'embedded.mobileprovision')
            profile=plistlib.loads(provision[provision.index(b'<?xml'):provision.index(b'</plist>')+8])
            assert profile['ExpirationDate'].timestamp()>time.time()
            assert profile['Entitlements']['application-identifier'].endswith('.app.gocogni.cogni')
            assert profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices')
            bundle=archive.read(app+'main.jsbundle')
            assert os.environ['EXPO_PUBLIC_SUPABASE_URL'].encode() in bundle
            assert os.environ['EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'].encode() in bundle
            for key in ['SUPABASE_SERVICE_ROLE_KEY','REVENUECAT_SECRET_API_KEY','REVENUECAT_WEBHOOK_HMAC_SECRET','REVENUECAT_WEBHOOK_AUTHORIZATION']:
                assert key.encode() not in bundle
        meta={'platform':'ios','version':'0.4.3','buildNumber':info['CFBundleVersion'],'sourceCommit':os.environ['SOURCE_COMMIT'],'sha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),'easBuildId':os.environ['EAS_BUILD_ID'],'registeredDeviceCount':len(profile.get('ProvisionedDevices',[])),'provisionExpiresAt':profile['ExpirationDate'].isoformat()+'Z','physicalDeviceTested':False}
        (root/'metadata.json').write_text(json.dumps(meta,indent=2)); print(json.dumps(meta))
        PY
    - name: Download verified Android upgrade baseline
      if: matrix.platform == 'android'
      run: |
        set -euo pipefail
        mkdir -p /tmp/cogni-upgrade
        curl --fail --location --retry 3 --max-time 180 https://github.com/robert8p/clearframe-mvp/releases/download/v0.4.2-preview.1/Cogni-0.4.2-preview.apk --output "$PREVIOUS_APK_PATH"
        echo "22fe4794bde224ec4eafd13770edb950de0ab1053557a0346f447cc0175121e5  $PREVIOUS_APK_PATH" | sha256sum --check --strict
    - name: Provision isolated disposable runtime identity
      if: matrix.platform == 'android'
      run: |
        python3 - <<'PY'
        import os,json,secrets,urllib.request,urllib.error
        email=f"cogni.e2e.route.{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}@example.com"
        password='Cg'+secrets.token_hex(18)+'9a'
        print('::add-mask::'+email); print('::add-mask::'+password)
        with open(os.environ['GITHUB_ENV'],'a') as f: f.write('E2E_EMAIL='+email+'\nE2E_PASSWORD='+password+'\n')
        def post(path,body):
            req=urllib.request.Request(os.environ['SUPABASE_URL']+path,data=json.dumps(body).encode(),headers={'apikey':os.environ['SUPABASE_KEY'],'Content-Type':'application/json'},method='POST')
            try:
                with urllib.request.urlopen(req,timeout=30) as response: return response.status,json.load(response)
            except urllib.error.HTTPError as error: return error.code,json.load(error)
        credentials={'email':email,'password':password}
        status,_=post('/auth/v1/signup',{**credentials,'data':{'full_name':'Cogni Route E2E'}})
        print('Signup status:',status)
        status,body=post('/auth/v1/token?grant_type=password',credentials)
        assert status==200 and body.get('access_token'),'Test identity preflight failed'
        print('Disposable identity verified; credentials are independent of build tokens.')
        PY
    - name: Enable Android emulator acceleration
      if: matrix.platform == 'android'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Execute Android upgrade, launch and interaction suites
      if: matrix.platform == 'android'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_5
        cores: 4
        ram-size: 3072M
        heap-size: 512M
        disk-size: 6G
        emulator-boot-timeout: 900
        disable-linux-hw-accel: false
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          bash -o pipefail -c 'python3 -u .github/scripts/cogni-upgrade-e2e.py 2>&1 | tee /tmp/cogni-upgrade.txt'
          bash .github/scripts/verify-cogni-apk-runtime.sh
          bash -o pipefail -c 'python3 -u .github/scripts/cogni-auth-route-e2e-fixed.py 2>&1 | tee /tmp/cogni-interactions.txt'
    - name: Remove only disposable test accounts and verify rejection
      if: always() && matrix.platform == 'android'
      run: |
        python3 - <<'PY'
        import json,os,urllib.request,urllib.error
        from pathlib import Path
        def post(path,payload,token=None):
            headers={'apikey':os.environ['SUPABASE_KEY'],'Content-Type':'application/json'}
            if token: headers['Authorization']='Bearer '+token
            req=urllib.request.Request(os.environ['SUPABASE_URL']+path,data=json.dumps(payload).encode(),headers=headers,method='POST')
            try:
                with urllib.request.urlopen(req,timeout=30) as response: return response.status,json.load(response)
            except urllib.error.HTTPError as error: return error.code,json.load(error)
        results=[]; base=os.environ.get('E2E_EMAIL')
        if base:
            expected=f"cogni.e2e.route.{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}@example.com"
            assert base==expected,'Refusing to clean up an unrelated identity'
            original=os.environ['E2E_PASSWORD']
            for email in [base,base.replace('.route.','.signup.')]:
                passwords=[original,original+'B2'] if email==base else [original]
                token=None
                for password in passwords:
                    status,body=post('/auth/v1/token?grant_type=password',{'email':email,'password':password})
                    token=body.get('access_token')
                    if token: break
                    assert status==400
                if token:
                    status,_=post('/functions/v1/mobile-api',{'path':'/api/mobile/account','method':'DELETE','body':None,'context':{'timeZone':'UTC'}},token)
                    assert status==200,'Disposable account deletion failed'
                    for password in passwords:
                        status,body=post('/auth/v1/token?grant_type=password',{'email':email,'password':password})
                        assert status==400 and not body.get('access_token')
                    results.append('Disposable account deleted; test passwords rejected.')
                else:
                    assert email!=base,'Route identity cleanup unverified'
                    results.append('Signup identity never created or already deleted by UI suite.')
        Path('/tmp/cogni-cleanup').mkdir(exist_ok=True)
        Path('/tmp/cogni-cleanup/cleanup.txt').write_text('\n'.join(results)); print('\n'.join(results))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cogni-043-expo-${{ matrix.platform }}-evidence-${{ github.run_attempt }}
        path: /tmp/cogni-expo-${{ matrix.platform }}/
        if-no-files-found: warn
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always() && matrix.platform == 'android'
      with:
        name: cogni-043-expo-android-runtime-${{ github.run_attempt }}
        path: |
          /tmp/cogni-0.4.3-artifact/
          /tmp/cogni-upgrade.txt
          /tmp/cogni-upgrade-api-36/
          /tmp/cogni-interactions.txt
          /tmp/cogni-cleanup/
          /tmp/cogni-runtime-api-36/
          /tmp/cogni-auth-route-api-36/
          /tmp/cogni-profile-password-api-36/
          /tmp/cogni-signup-onboarding-api-36/
          /tmp/cogni-copy-feedback-api-36/
          /tmp/cogni-monetization-prestore-api-36/
        if-no-files-found: warn
        retention-days: 30
