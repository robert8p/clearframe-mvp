name: Temporary normalize Expo SDK 54 lock

on:
  push:
    branches:
      - feat/cogni-0.4.0-monetisation
    paths:
      - mobile/package.json

permissions:
  contents: write

concurrency:
  group: temp-normalize-expo-sdk54-lock
  cancel-in-progress: true

jobs:
  normalize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cogni-0.4.0-monetisation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate the lock from the pinned SDK 54 package set
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Reject cross-SDK native package resolution
        working-directory: mobile
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const asset = packages['node_modules/expo-asset']?.version;
          const core = packages['node_modules/expo-modules-core']?.version;
          if (asset !== '12.0.13') throw new Error(`Expected top-level expo-asset 12.0.13, found ${asset}`);
          if (!String(core || '').startsWith('3.0.')) throw new Error(`Expected SDK 54 expo-modules-core 3.0.x, found ${core}`);
          for (const [path, metadata] of Object.entries(packages)) {
            if (!path.includes('node_modules/expo-asset')) continue;
            const version = String(metadata?.version || '');
            if (version.startsWith('57.')) throw new Error(`Cross-SDK expo-asset remains at ${path}: ${version}`);
          }
          console.log(`Expo native package set aligned: expo-asset=${asset}; expo-modules-core=${core}`);
          NODE

      - name: Commit the generated package-lock
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "package-lock.json was already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Normalize Expo SDK 54 native dependency lock"
          git push origin HEAD:feat/cogni-0.4.0-monetisation
