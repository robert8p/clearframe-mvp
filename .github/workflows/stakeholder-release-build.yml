name: Build and validate stakeholder-hardened Cogni release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stakeholder-release-build.yml"

permissions:
  contents: write

timeout-minutes: 35

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cogni_build_validation
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cogni_build_validation
      SUPABASE_SERVICE_ROLE_KEY: cogni_build_validation_only
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Verify stakeholder implementation is present
        run: |
          set -euo pipefail
          test -f STAKEHOLDER_REVIEW.md
          test -f app/api/mobile/account/route.ts
          test -f mobile/app/account.tsx
          grep -q '"version": "0.2.0"' mobile/app.json
          grep -q '"versionCode": 2' mobile/app.json
      - name: Validate web and backend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run stakeholder-audit
          npx tsc --noEmit
          npm run build
      - name: Validate native app
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund
          npx expo install --check
          npm run ui-audit
          npm run typecheck
      - name: Submit Android internal preview
        id: submit
        working-directory: mobile
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@21.7.1 build --platform android --profile preview --non-interactive --no-wait 2>&1 | tee /tmp/eas-submit.log
          BUILD_ID=$(grep -oE 'builds/[0-9a-f-]{36}' /tmp/eas-submit.log | tail -1 | cut -d/ -f2)
          test -n "$BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for EAS and download APK
        id: eas
        working-directory: mobile
        env:
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 28); do
            npx eas-cli@21.7.1 build:view "$BUILD_ID" --json > /tmp/eas-build.json
            STATUS=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8"));process.stdout.write(j.status)')
            echo "EAS $BUILD_ID: $STATUS ($attempt/28)"
            if [ "$STATUS" = "FINISHED" ]; then break; fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then cat /tmp/eas-build.json; exit 1; fi
            sleep 45
          done
          STATUS=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8"));process.stdout.write(j.status)')
          test "$STATUS" = "FINISHED"
          BUILD_URL=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8"));process.stdout.write(j.artifacts.buildUrl || j.artifacts.applicationArchiveUrl || "")')
          test -n "$BUILD_URL"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/Cogni-0.2.0.apk "$BUILD_URL"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
      - name: Verify APK archive, identity, permissions and signature
        id: apk
        run: |
          set -euo pipefail
          unzip -t /tmp/Cogni-0.2.0.apk >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          BADGING=$($AAPT dump badging /tmp/Cogni-0.2.0.apk)
          echo "$BADGING" | grep -q "package: name='app.gocogni.cogni'"
          echo "$BADGING" | grep -q "versionCode='2'"
          echo "$BADGING" | grep -q "versionName='0.2.0'"
          echo "$BADGING" | grep -q "application-label:'Cogni'"
          PERMS=$($AAPT dump permissions /tmp/Cogni-0.2.0.apk)
          echo "$PERMS"
          ! echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          ! echo "$PERMS" | grep -q 'android.permission.READ_EXTERNAL_STORAGE'
          ! echo "$PERMS" | grep -q 'android.permission.WRITE_EXTERNAL_STORAGE'
          $APKSIGNER verify --verbose --print-certs /tmp/Cogni-0.2.0.apk
          SHA=$(sha256sum /tmp/Cogni-0.2.0.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Publish stable internal-alpha download
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="cogni-0.2.0-stakeholder-alpha"
          TARGET_SHA=$(git rev-parse HEAD^)
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" /tmp/Cogni-0.2.0.apk#Cogni-0.2.0.apk \
            --target "$TARGET_SHA" \
            --title "Cogni 0.2.0 — stakeholder-hardened internal alpha" \
            --notes "Validated web/backend and Android internal-alpha build. EAS build: $BUILD_ID. APK SHA-256: $APK_SHA. This remains an internal alpha pending physical-device QA, leaked-password protection, durable distributed rate limiting and external security testing."
      - name: Record release and remove temporary workflow
        env:
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
          BUILD_URL: ${{ steps.eas.outputs.build_url }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > RELEASE_STATUS.md <<EOF
          # Cogni stakeholder-hardened internal-alpha release

          - Version: 0.2.0
          - Android versionCode: 2
          - EAS build ID: $BUILD_ID
          - EAS build page: https://expo.dev/accounts/cogniapp/projects/cogni/builds/$BUILD_ID
          - APK SHA-256: $APK_SHA
          - Stable GitHub release: https://github.com/robert8p/clearframe-mvp/releases/tag/cogni-0.2.0-stakeholder-alpha
          - Validation: stakeholder audit, root TypeScript, Next.js production build, Expo dependency check, mobile UI audit, mobile TypeScript, APK archive, identity, permissions and signature all passed.
          - Residual gates: physical-device journey QA; Supabase leaked-password protection; durable distributed/platform rate limiting; external penetration test before broad public launch.
          EOF
          rm .github/workflows/stakeholder-release-build.yml
          git config user.name "Cogni Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record validated Cogni 0.2.0 stakeholder release"
          git push origin HEAD:main
