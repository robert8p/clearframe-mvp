name: EAS debug latest Android build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-debug-build.yml"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Fetch failed build log
        working-directory: mobile
        run: |
          npx eas-cli@latest build:view 0b5b455d-27da-43ae-bfd8-2445f74cb036 --json > /tmp/build.json
          URL=$(node -e 'const b=require("/tmp/build.json"); console.log(b.logFiles?.[0] || "")')
          test -n "$URL"
          curl -fsSL "$URL" -o /tmp/eas-build.log
          echo "===== EAS BUILD LOG ====="
          cat /tmp/eas-build.log
