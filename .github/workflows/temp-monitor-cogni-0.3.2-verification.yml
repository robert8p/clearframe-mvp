name: Observe Cogni 0.3.2 verification

on:
  pull_request:
    paths:
      - ".github/workflows/temp-monitor-cogni-0.3.2-verification.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 5b21dbcc2d70f641ce08f51c32cd8f4e3fcd30fd
      TARGET_WORKFLOW: Cogni 0.3.2 clean rebuild and runtime verification
    steps:
      - name: Observe the exact rebuild verification run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 160); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=50" \
              > /tmp/runs.json

            node <<'NODE' > /tmp/selected-run.json
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
            const run = (data.workflow_runs ?? [])
              .filter((item) => item?.name === process.env.TARGET_WORKFLOW && item?.event === 'push')
              .sort((a, b) => String(b.created_at ?? '').localeCompare(String(a.created_at ?? '')))[0] ?? null;
            process.stdout.write(JSON.stringify(run));
            NODE

            FOUND=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(j?'yes':'no')")
            if [ "$FOUND" = "no" ]; then
              echo "Target verification run not visible yet ($attempt/160)."
              sleep 20
              continue
            fi

            RUN_ID=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(String(j.id))")
            STATUS=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(j.status??'')")
            CONCLUSION=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(j.conclusion??'')")
            echo "TARGET_RUN_ID=$RUN_ID"
            echo "TARGET_STATUS=$STATUS"
            echo "TARGET_CONCLUSION=${CONCLUSION:-pending}"

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/jobs.json

            node <<'NODE'
            const fs = require('fs');
            const jobs = JSON.parse(fs.readFileSync('/tmp/jobs.json', 'utf8')).jobs ?? [];
            for (const job of jobs) {
              console.log(`TARGET_JOB id=${job.id} name=${JSON.stringify(job.name)} status=${job.status} conclusion=${job.conclusion ?? 'pending'}`);
              for (const step of job.steps ?? []) {
                console.log(`  STEP ${step.number}: ${step.name} => ${step.status}/${step.conclusion ?? 'pending'}`);
              }
            }
            NODE

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "Target verification failed."
                exit 1
              fi
              echo "Target verification passed."
              exit 0
            fi

            sleep 20
          done

          echo "Target verification did not complete within the observation window."
          exit 1
