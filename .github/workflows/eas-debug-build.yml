name: EAS debug latest Android build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-debug-build.yml"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Show recent Android builds
        working-directory: mobile
        run: npx eas-cli@latest build:list --platform android --limit 3 --json --non-interactive
      - name: Show failed build details
        working-directory: mobile
        run: npx eas-cli@latest build:view 0b5b455d-27da-43ae-bfd8-2445f74cb036 --json || true
