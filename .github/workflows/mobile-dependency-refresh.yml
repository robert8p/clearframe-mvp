name: Refresh mobile hardening dependencies

on:
  push:
    branches: [feature/full-codebase-hardening]
    paths:
      - ".github/workflows/mobile-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/full-codebase-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx expo install expo-secure-store
          npx expo install eslint eslint-config-expo -- -D
      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Install secure storage and Expo lint dependencies"
          git push origin HEAD:feature/full-codebase-hardening
