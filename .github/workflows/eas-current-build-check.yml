name: EAS current build check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-current-build-check.yml"

jobs:
  check-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: "0b5b455d-27da-43ae-bfd8-2445f74cb036"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for EAS build result
        working-directory: mobile
        run: |
          for attempt in $(seq 1 20); do
            npx eas-cli@latest build:view "$BUILD_ID" --json > /tmp/build.json
            STATUS=$(node -e 'const b=require("/tmp/build.json"); console.log(String(b.status || "").toLowerCase())')
            echo "Attempt $attempt: $STATUS"
            cat /tmp/build.json
            if [ "$STATUS" = "finished" ]; then
              exit 0
            fi
            if [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              exit 1
            fi
            sleep 15
          done
          echo "Build is still running after the monitoring window."
          exit 0
