name: Temporary copy feedback E2E patcher

on:
  push:
    branches:
      - feat/cogni-0.4.0-monetisation
    paths:
      - mobile/app/(tabs)/_layout.tsx

permissions:
  contents: write

concurrency:
  group: cogni-copy-feedback-e2e-patcher
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cogni-0.4.0-monetisation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect copy-feedback E2E to the exact gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path('.github/scripts/cogni-auth-route-e2e-fixed.py')
          source = orchestrator.read_text()
          marker = '    ROOT / "cogni-auth-main-flow.py",\n'
          addition = marker + '    ROOT / "cogni-copy-feedback-e2e.py",\n'
          if 'cogni-copy-feedback-e2e.py' not in source:
              if marker not in source:
                  raise SystemExit('Missing E2E suite insertion point')
              source = source.replace(marker, addition, 1)
          orchestrator.write_text(source)

          workflow = Path('.github/workflows/cogni-0.4.0-exact-apk.yml')
          source = workflow.read_text()
          permission_marker = '          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" /tmp/apk-permissions.txt\n'
          if 'android.permission.RECORD_AUDIO" /tmp/apk-permissions.txt' not in source:
              if permission_marker not in source:
                  raise SystemExit('Missing APK permission insertion point')
              source = source.replace(
                  permission_marker,
                  permission_marker + '          ! grep -q "android.permission.RECORD_AUDIO" /tmp/apk-permissions.txt\n',
                  1,
              )
          artifact_marker = '            /tmp/cogni-profile-password-api-36\n'
          if '/tmp/cogni-copy-feedback-api-36' not in source:
              if artifact_marker not in source:
                  raise SystemExit('Missing runtime artifact insertion point')
              source = source.replace(
                  artifact_marker,
                  artifact_marker + '            /tmp/cogni-copy-feedback-api-36\n',
                  1,
              )
          workflow.write_text(source)
          PY

      - name: Commit exact-gate connections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/cogni-auth-route-e2e-fixed.py .github/workflows/cogni-0.4.0-exact-apk.yml
          if git diff --cached --quiet; then
            echo "Exact-gate connections are already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Run copy and feedback checks on the exact APK"
          git push origin HEAD:feat/cogni-0.4.0-monetisation
