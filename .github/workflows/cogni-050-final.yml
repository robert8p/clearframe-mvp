name: Cogni 0.5.0 visual reconstruction Android release
on:
  push:
    branches: [release/cogni-0.5.0]
    paths: ['mobile/**', '.github/workflows/cogni-050-final.yml', '.github/scripts/cogni-050-fix.py']
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CI: '1'
  TZ: Europe/London
  EXPO_PUBLIC_SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: source
        name: Apply final compatibility refinements once
        run: |
          set -euo pipefail
          python3 .github/scripts/cogni-050-fix.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'fix(mobile): satisfy Cogni accessibility and release invariants'
            git push origin HEAD:refs/heads/release/cogni-0.5.0
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate exact 0.5.0 mobile source
        if: steps.source.outputs.ready == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          node -e "const a=require('./app.json').expo;if(a.version!=='0.5.0'||a.android.package!=='app.gocogni.cogni'||a.extra.eas.projectId!=='24fc0fea-5e66-4365-a82c-ac668aded7d0')process.exit(1)"
          npm ci --include=dev --no-audit --no-fund
          npx expo install --check
          npm run validate 2>&1 | tee /tmp/cogni-050-validate.txt
          npx expo-doctor 2>&1 | tee /tmp/cogni-050-doctor.txt
          npx expo export --platform android --output-dir /tmp/cogni-050-export 2>&1 | tee /tmp/cogni-050-export.txt
          git diff --exit-code
      - uses: denoland/setup-deno@v2
        if: steps.source.outputs.ready == 'true'
        with: { deno-version: v2.x }
      - name: Re-verify preserved scoring, immutable sessions and entitlements
        if: steps.source.outputs.ready == 'true'
        run: |
          set -euo pipefail
          deno check --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/index.ts
          deno check --config supabase/functions/revenuecat-webhook/deno.json --node-modules-dir=auto supabase/functions/revenuecat-webhook/index.ts
          deno test --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/engine_test.ts
          deno test --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/content-versioning_test.ts
          deno test --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/session-content_test.ts
          deno test --config supabase/functions/mobile-api/deno.json --node-modules-dir=auto supabase/functions/mobile-api/monetization_test.ts
          deno test --config supabase/functions/revenuecat-webhook/deno.json --node-modules-dir=auto supabase/functions/revenuecat-webhook/logic_test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-050-validation
          path: /tmp/cogni-050-*.txt
          retention-days: 30

  expo:
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: mobile } }
    env:
      SOURCE_COMMIT: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Request signed Android Expo preview
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        run: |
          set -euo pipefail
          mkdir -p /tmp/cogni-050-expo
          npx eas-cli@21.7.1 build --platform android --profile preview --non-interactive --no-wait --json > /tmp/cogni-050-expo/request.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads(Path('/tmp/cogni-050-expo/request.json').read_text())[0]
          assert b['platform']=='ANDROID' and b['gitCommitHash']==os.environ['SOURCE_COMMIT']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EAS_BUILD_ID='+b['id']+'\n')
          Path('/tmp/cogni-050-expo/request-summary.json').write_text(json.dumps({'id':b['id'],'sourceCommit':b['gitCommitHash'],'buildPage':'https://expo.dev/accounts/cogniapp/projects/cogni/builds/'+b['id']},indent=2))
          PY
      - name: Await cloud completion and download exact APK
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('/tmp/cogni-050-expo'); errors=0
          for _ in range(200):
              try:
                  p=subprocess.run(['npx','eas-cli@21.7.1','build:view',os.environ['EAS_BUILD_ID'],'--json'],text=True,capture_output=True,timeout=90)
                  if p.returncode: raise RuntimeError(p.stderr[-1000:])
                  b=json.loads(p.stdout)
              except Exception:
                  errors+=1
                  if errors>=6: raise
                  time.sleep(20); continue
              errors=0; (root/'build.json').write_text(json.dumps(b))
              print('Expo Android:',b['status'],flush=True)
              if b['status']=='FINISHED': break
              if b['status'] in ['ERRORED','CANCELED']: raise RuntimeError(str(b.get('error') or b['status']))
              time.sleep(30)
          else: raise TimeoutError('Expo build did not finish')
          assert b['gitCommitHash']==os.environ['SOURCE_COMMIT'] and b['appVersion']=='0.5.0' and b['platform']=='ANDROID' and b['distribution']=='INTERNAL'
          url=b['artifacts']['buildUrl']; u=urlparse(url); assert u.scheme=='https' and (u.hostname=='expo.dev' or u.hostname.endswith('.expo.dev'))
          subprocess.run(['curl','--fail','--location','--retry','5','--max-time','300',url,'--output',str(root/'Cogni-0.5.0-preview.apk')],check=True)
          out={'id':b['id'],'version':b['appVersion'],'buildNumber':b['appBuildVersion'],'sourceCommit':b['gitCommitHash'],'buildPage':'https://expo.dev/accounts/cogniapp/projects/cogni/builds/'+b['id'],'downloadUrl':url,'status':'FINISHED'}
          (root/'completion.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: android-actions/setup-android@v3
      - name: Verify APK identity, signing and permission surface
        run: |
          set -euo pipefail
          OUT=/tmp/cogni-050-expo; APK="$OUT/Cogni-0.5.0-preview.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > "$OUT/badging.txt"
          "$AAPT" dump permissions "$APK" > "$OUT/permissions.txt"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$OUT/signature.txt"
          "$ZIPALIGN" -c -P 16 4 "$APK"
          grep -q "package: name='app.gocogni.cogni'" "$OUT/badging.txt"
          grep -q "versionName='0.5.0'" "$OUT/badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/badging.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/signature.txt"
          tr -d ':' < "$OUT/signature.txt" | tr '[:upper:]' '[:lower:]' > /tmp/signer.txt
          grep -q 'e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e' /tmp/signer.txt
          for permission in RECORD_AUDIO SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE POST_NOTIFICATIONS; do ! grep -q "android.permission.$permission" "$OUT/permissions.txt"; done
          unzip -t "$APK" >/dev/null
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('/tmp/cogni-050-expo'); b=json.loads((root/'completion.json').read_text())
          version=int(re.search(r"versionCode='(\d+)'",(root/'badging.txt').read_text()).group(1))
          assert version>67 and str(version)==b['buildNumber']
          b['versionCode']=version; b['sha256']=hashlib.sha256((root/'Cogni-0.5.0-preview.apk').read_bytes()).hexdigest(); b['apkIdentityAndSigning']='passed'
          (root/'metadata.json').write_text(json.dumps(b,indent=2)); print(json.dumps(b,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cogni-050-expo-apk
          path: /tmp/cogni-050-expo/
          retention-days: 30
          if-no-files-found: error

  installed:
    needs: [validate, expo]
    strategy:
      fail-fast: false
      matrix: { lane: [visual, regression] }
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APK_PATH: /tmp/cogni-050-expo/Cogni-0.5.0-preview.apk
      SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
      SUPABASE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cogni-050-expo-apk
          path: /tmp/cogni-050-expo
      - name: Provision isolated test identity
        env: { MATRIX_LANE: '${{ matrix.lane }}' }
        run: |
          python3 - <<'PY'
          import json,os,secrets,urllib.request,urllib.error
          def post(path,payload,token=None):
              h={'apikey':os.environ['SUPABASE_KEY'],'Content-Type':'application/json'}
              if token: h['Authorization']='Bearer '+token
              r=urllib.request.Request(os.environ['SUPABASE_URL']+path,data=json.dumps(payload).encode(),headers=h,method='POST')
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:return x.status,json.load(x)
              except urllib.error.HTTPError as e:return e.code,json.load(e)
          email=f"cogni.e2e.050.{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}.{os.environ['MATRIX_LANE']}@example.com"; password='Cg'+secrets.token_hex(18)+'9a'
          print('::add-mask::'+email); print('::add-mask::'+password)
          status,_=post('/auth/v1/signup',{'email':email,'password':password,'data':{'full_name':'Cogni Route E2E'}}); assert status==200
          status,b=post('/auth/v1/token?grant_type=password',{'email':email,'password':password}); assert status==200 and b.get('access_token')
          status,_=post('/functions/v1/mobile-api',{'path':'/api/mobile/profile','method':'POST','body':{'fullName':'Cogni Route E2E','audienceSegment':'casual','functionArea':'everyday_decisions','primaryGoal':'think_more_clearly'},'context':{'timeZone':'Europe/London'}},b['access_token']); assert status==200
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('E2E_EMAIL='+email+'\nE2E_PASSWORD='+password+'\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Verify installed Android application
        timeout-minutes: 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            if [ "${{ matrix.lane }}" = visual ]; then timeout 1100 bash -o pipefail -c 'python3 -u .github/scripts/cogni-bounded-run.py cogni-045-visual-e2e.py 2>&1 | tee /tmp/cogni-050-visual.txt'; fi
            if [ "${{ matrix.lane }}" = regression ]; then timeout 1100 bash -o pipefail -c 'python3 -u .github/scripts/cogni-bounded-run.py cogni-auth-route-e2e-fixed.py 2>&1 | tee /tmp/cogni-050-regression.txt'; fi
      - name: Delete isolated test identity
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          def post(path,payload,token=None):
              h={'apikey':os.environ['SUPABASE_KEY'],'Content-Type':'application/json'}
              if token: h['Authorization']='Bearer '+token
              r=urllib.request.Request(os.environ['SUPABASE_URL']+path,data=json.dumps(payload).encode(),headers=h,method='POST')
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:return x.status,json.load(x)
              except urllib.error.HTTPError as e:return e.code,json.load(e)
          email=os.environ.get('E2E_EMAIL'); pw=os.environ.get('E2E_PASSWORD')
          if email and pw:
              status,b=post('/auth/v1/token?grant_type=password',{'email':email,'password':pw})
              if status==200 and b.get('access_token'):
                  status,_=post('/functions/v1/mobile-api',{'path':'/api/mobile/account','method':'DELETE','body':None,'context':{'timeZone':'UTC'}},b['access_token']); assert status==200
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-050-installed-${{ matrix.lane }}
          path: |
            /tmp/cogni-050-*.txt
            /tmp/cogni-045-visual/
            /tmp/cogni-045-bounded/
            /tmp/cogni-auth-route-api-36/
          retention-days: 30
          if-no-files-found: warn
