name: Cogni portrait layer compatibility check
on:
  push:
    branches: [release/cogni-0.4.5]
    paths: [.github/workflows/cogni-045-image-layers.yml]
permissions:
  contents: read
jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        variant: [png-data-uri, image-only, gradients-only]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
      EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY: ' '
      EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY: ' '
      CI: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d300afc544bfe917dc69429dc702e9ea28a4efe3
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Compile transient diagnostic bundle without changing the repository
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p /tmp/layers
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('components/visuals.tsx');s=p.read_text();a=s.index('export function WelcomeArtwork()');b=s.index('export type MotifKind',a);part=s[a:b]
          variant=os.environ['VARIANT']
          if variant=='gradients-only':part='\n'.join(line for line in part.split('\n') if '<Image source=' not in line)
          elif variant=='image-only':
              part='\n'.join(line for line in part.split('\n') if '<LinearGradient ' not in line)
              part=part.replace('approved-dreamscape.png','approved-dreamscape.webp')
          else:
              encoded=base64.b64encode(Path('assets/approved-dreamscape.png').read_bytes()).decode()
              part=part.replace('require("../assets/approved-dreamscape.png")','{uri:"data:image/png;base64,'+encoded+'"}')
          p.write_text(s[:a]+part+s[b:])
          PY
          npm ci --include=dev --no-audit --no-fund
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo-router/entry.js --bundle-output /tmp/layers/index.android.bundle --assets-dest /tmp/layers/resources
      - name: Re-sign diagnostic APK with an isolated disposable test key
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 https://expo.dev/artifacts/eas/I3gSpUZYogOTT-XRAGsNHZOF7NjL6tbVkoXODgFFM38.apk --output /tmp/original.apk
          echo 'b427f68cea176cd8fb0e062307dba86f5983bbfc28f311eeedd884a5bd716bf2  /tmp/original.apk' | sha256sum --check --strict
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/original.apk') as source,ZipFile('/tmp/unsigned.apk','w') as target:
              bundles=[n for n in source.namelist() if n.endswith('/index.android.bundle')];assert len(bundles)==1
              for info in source.infolist():
                  if info.filename.startswith('META-INF/'):continue
                  target.writestr(info,Path('/tmp/layers/index.android.bundle').read_bytes() if info.filename==bundles[0] else source.read(info.filename))
          PY
          ALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$ALIGN" -P 16 -f 4 /tmp/unsigned.apk /tmp/diagnostic.apk
          keytool -genkeypair -keystore /tmp/disposable.jks -alias diagnostic -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Test Only'
          "$SIGNER" sign --ks /tmp/disposable.jks --ks-key-alias diagnostic --ks-pass pass:android --key-pass pass:android /tmp/diagnostic.apk
          "$SIGNER" verify /tmp/diagnostic.apk
      - name: Prepare bounded launch
        run: |
          cat > /tmp/check.py <<'PY'
          import subprocess,time,json,os
          from pathlib import Path
          out=Path('/tmp/layers');log=(out/'logcat.txt').open('wb')
          proc=subprocess.Popen(['adb','logcat','-v','threadtime'],stdout=log,stderr=subprocess.STDOUT)
          result={'variant':os.environ['VARIANT'],'diagnosticOnly':True}
          def adb(*args,timeout=30):return subprocess.check_output(['adb',*args],timeout=timeout)
          try:
              adb('install','-r','/tmp/diagnostic.apk',timeout=150)
              adb('shell','am','start','-W','-n','app.gocogni.cogni/.MainActivity',timeout=45);time.sleep(7)
              (out/'welcome.png').write_bytes(adb('exec-out','screencap','-p'))
              adb('shell','uiautomator','dump','--compressed','/sdcard/check.xml')
              xml=adb('shell','cat','/sdcard/check.xml');(out/'hierarchy.xml').write_bytes(xml)
              assert b'Sharpen how you think.' in xml
              result['status']='passed'
          except Exception as error:
              result['status']='failed';result['error']=str(error);raise
          finally:proc.terminate();log.close();(out/'result.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: python3 -u /tmp/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-layers-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            /tmp/layers/*.txt
            /tmp/layers/*.json
            /tmp/layers/*.xml
            /tmp/layers/*.png
          retention-days: 7
          if-no-files-found: warn
