name: Publish verified Cogni 0.3.3 APK to Expo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-publish-cogni-0.3.3-to-expo.yml"

permissions:
  actions: read
  contents: write

jobs:
  upload-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SOURCE_RUN_ID: "32906341288"
      EXPECTED_SHA256: "840d33da0173f2b6b7a64b9786923b0de5242bf56581ac798bab347b71c07bd8"
      EXPECTED_VERSION: "0.3.3"
      EXPECTED_VERSION_CODE: "36"
    outputs:
      expo_build_id: ${{ steps.expo.outputs.expo_build_id }}
      expo_page_url: ${{ steps.expo.outputs.expo_page_url }}
      expo_artifact_url: ${{ steps.expo.outputs.expo_artifact_url }}
      apk_sha256: ${{ steps.expo.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Require Expo token
        run: test -n "$EXPO_TOKEN"

      - name: Download the exact APK that passed the full Android interaction suite
        uses: actions/download-artifact@v4
        with:
          name: cogni-0.3.3-exact-apk
          path: /tmp/cogni-tested
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify the tested artifact before upload
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/cogni-tested/Cogni-0.3.3.apk
          META=/tmp/cogni-tested/metadata.json
          test -s "$APK"
          test -s "$META"
          node - <<'NODE'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('/tmp/cogni-tested/metadata.json', 'utf8'));
          if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error(`Unexpected version ${metadata.version}`);
          if (String(metadata.versionCode) !== process.env.EXPECTED_VERSION_CODE) throw new Error(`Unexpected version code ${metadata.versionCode}`);
          if (metadata.sha256 !== process.env.EXPECTED_SHA256) throw new Error(`Unexpected metadata digest ${metadata.sha256}`);
          console.log(metadata);
          NODE
          echo "$EXPECTED_SHA256  $APK" | sha256sum -c -
          unzip -t "$APK" >/dev/null

      - name: Install project dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Upload the exact tested APK to Expo and verify the hosted bytes
        id: expo
        shell: bash
        run: |
          set -euo pipefail
          TESTED_APK=/tmp/cogni-tested/Cogni-0.3.3.apk

          npx eas-cli@22.0.0 upload \
            --platform android \
            --build-path "$TESTED_APK" \
            --json \
            --non-interactive \
            > /tmp/expo-upload.json

          EXPO_PAGE_URL=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/expo-upload.json","utf8"));if(typeof j.url!=="string"||!j.url.startsWith("https://expo.dev/"))process.exit(2);process.stdout.write(j.url)')
          EXPO_BUILD_ID=${EXPO_PAGE_URL##*/}
          test -n "$EXPO_BUILD_ID"

          npx eas-cli@22.0.0 build:view "$EXPO_BUILD_ID" --json > /tmp/expo-build.json
          EXPO_STATUS=$(node -e 'const j=require("/tmp/expo-build.json");process.stdout.write(j.status??"")')
          EXPO_VERSION=$(node -e 'const j=require("/tmp/expo-build.json");process.stdout.write(j.appVersion??"")')
          EXPO_VERSION_CODE=$(node -e 'const j=require("/tmp/expo-build.json");process.stdout.write(String(j.appBuildVersion??j.versionCode??""))')
          EXPO_ARTIFACT_URL=$(node -e 'const j=require("/tmp/expo-build.json");process.stdout.write(j.artifacts?.buildUrl??j.artifactUrl??"")')

          test "$EXPO_STATUS" = "FINISHED"
          test "$EXPO_VERSION" = "$EXPECTED_VERSION"
          test "$EXPO_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test -n "$EXPO_ARTIFACT_URL"

          mkdir -p /tmp/cogni-expo
          curl -fL --retry 5 --retry-delay 3 -o /tmp/cogni-expo/Cogni-0.3.3.apk "$EXPO_ARTIFACT_URL"
          unzip -t /tmp/cogni-expo/Cogni-0.3.3.apk >/dev/null
          HOSTED_SHA256=$(sha256sum /tmp/cogni-expo/Cogni-0.3.3.apk | awk '{print $1}')
          test "$HOSTED_SHA256" = "$EXPECTED_SHA256"
          cmp --silent "$TESTED_APK" /tmp/cogni-expo/Cogni-0.3.3.apk

          cp /tmp/expo-upload.json /tmp/cogni-expo/
          cp /tmp/expo-build.json /tmp/cogni-expo/
          cp /tmp/cogni-tested/metadata.json /tmp/cogni-expo/tested-metadata.json

          echo "expo_build_id=$EXPO_BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "expo_page_url=$EXPO_PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "expo_artifact_url=$EXPO_ARTIFACT_URL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$HOSTED_SHA256" >> "$GITHUB_OUTPUT"
          echo "PASS: Expo-hosted APK is byte-identical to the exact fully tested APK."

      - name: Preserve the Expo-hosted copy for independent runtime verification
        uses: actions/upload-artifact@v4
        with:
          name: cogni-0.3.3-expo-hosted-copy
          path: /tmp/cogni-expo
          if-no-files-found: error
          retention-days: 14

  runtime-test-expo-copy:
    needs: upload-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: https://dhklfrqhsmofqrawfdjz.supabase.co
      SUPABASE_KEY: sb_publishable_Y1pPv4wp0DcQuq3XCEB0GA_mJtNPE2b
      API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v6

      - name: Download the independently retrieved Expo-hosted APK
        uses: actions/download-artifact@v4
        with:
          name: cogni-0.3.3-expo-hosted-copy
          path: /tmp/cogni-expo

      - name: Verify the Expo-hosted copy digest again
        run: |
          test -s /tmp/cogni-expo/Cogni-0.3.3.apk
          echo "${{ needs.upload-and-verify.outputs.apk_sha256 }}  /tmp/cogni-expo/Cogni-0.3.3.apk" | sha256sum -c -

      - name: Derive and provision the disposable E2E account
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="cogni.e2e.route.${GITHUB_RUN_ID}@example.com"
          SECRET=$(printf '%s' "$EXPO_TOKEN:$GITHUB_RUN_ID:cogni-auth-route" | sha256sum | cut -c1-28)
          PASSWORD="Cg${SECRET}9a"
          export EMAIL PASSWORD
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "E2E_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          node -e 'process.stdout.write(JSON.stringify({email:process.env.EMAIL,password:process.env.PASSWORD,data:{full_name:"Cogni Route E2E"}}))' > /tmp/signup-body.json
          curl -fsSL -o /tmp/signup.json \
            -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/signup-body.json

          node -e 'process.stdout.write(JSON.stringify({email:process.env.EMAIL,password:process.env.PASSWORD}))' > /tmp/signin-body.json
          curl -fsSL -o /tmp/signin.json \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/signin-body.json
          ACCESS_TOKEN=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/signin.json","utf8"));process.stdout.write(j.access_token??"")')
          test -n "$ACCESS_TOKEN"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Exercise every launch, auth, onboarding, account and tab route on the Expo-hosted bytes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: APK_PATH=/tmp/cogni-expo/Cogni-0.3.3.apk E2E_EMAIL="$E2E_EMAIL" E2E_PASSWORD="$E2E_PASSWORD" SUPABASE_URL="$SUPABASE_URL" SUPABASE_KEY="$SUPABASE_KEY" API_LEVEL=36 python3 .github/scripts/cogni-auth-route-e2e-fixed.py

      - name: Preserve Expo-hosted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogni-0.3.3-expo-hosted-runtime-api-36
          path: |
            /tmp/cogni-auth-route-api-36
            /tmp/cogni-profile-password-api-36
          if-no-files-found: warn
          retention-days: 14

      - name: Delete any remaining disposable test accounts
        if: always()
        shell: bash
        run: |
          set +e
          for KIND in route signup; do
            EMAIL="cogni.e2e.${KIND}.${GITHUB_RUN_ID}@example.com"
            SECRET=$(printf '%s' "$EXPO_TOKEN:$GITHUB_RUN_ID:cogni-auth-route" | sha256sum | cut -c1-28)
            PASSWORD="Cg${SECRET}9a"
            export EMAIL PASSWORD
            node -e 'process.stdout.write(JSON.stringify({email:process.env.EMAIL,password:process.env.PASSWORD}))' > /tmp/signin-cleanup.json
            curl -sS -o /tmp/signin-cleanup-response.json \
              -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/signin-cleanup.json
            ACCESS_TOKEN=$(node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync("/tmp/signin-cleanup-response.json","utf8"))}catch{}process.stdout.write(j.access_token??"")')
            if [ -n "$ACCESS_TOKEN" ]; then
              curl -sS -X DELETE "$SUPABASE_URL/functions/v1/mobile-api/api/mobile/account" \
                -H "apikey: $SUPABASE_KEY" \
                -H "Authorization: Bearer $ACCESS_TOKEN" >/dev/null
            fi
          done

  record-release:
    needs: [upload-and-verify, runtime-test-expo-copy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ github.token }}

      - name: Record the verified Expo release
        env:
          EXPO_BUILD_ID: ${{ needs.upload-and-verify.outputs.expo_build_id }}
          EXPO_PAGE_URL: ${{ needs.upload-and-verify.outputs.expo_page_url }}
          EXPO_ARTIFACT_URL: ${{ needs.upload-and-verify.outputs.expo_artifact_url }}
          APK_SHA256: ${{ needs.upload-and-verify.outputs.apk_sha256 }}
        run: |
          cat > EXPO_0.3.3_RELEASE.md <<EOF
          # Cogni 0.3.3 verified Expo release

          - status: PASS
          - app_version: 0.3.3
          - version_code: 36
          - package: app.gocogni.cogni
          - APK_SHA-256: $APK_SHA256
          - tested_PR_head: b7160b52335eb497c22602220fc5d5b590b791cf
          - tested_merge_source: 1e3ba7ebf4f7a6430cd461cb4a248aaa4db06a20
          - source_artifact_run: 32906341288
          - Expo_build_id: $EXPO_BUILD_ID
          - Expo_build_page: $EXPO_PAGE_URL
          - Expo_artifact_url: $EXPO_ARTIFACT_URL
          - Expo_hosted_bytes_match_tested_APK: PASS
          - Android_16_full_launch_auth_signup_recovery_onboarding_tabs_profile_password_signout_delete_flow: PASS
          - Expo_hosted_copy_full_runtime_retest: PASS
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXPO_0.3.3_RELEASE.md
          git commit -m 'Record verified Expo-hosted Cogni 0.3.3 release'
          git push origin HEAD:main
