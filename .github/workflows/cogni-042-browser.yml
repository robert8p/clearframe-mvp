name: Cogni 0.4.2 browser design verification
on:
  push:
    branches: [preview/cogni-042-design]
    paths: ['.github/workflows/cogni-042-browser.yml', '.github/scripts/verify-web-042.sh', 'components/PracticePreview.tsx', 'app/cogni-v042-system.css']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and verify responsive pages and interactive example
        run: bash .github/scripts/verify-web-042.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-042-browser-evidence
          path: /tmp/cogni-browser/
          retention-days: 30
