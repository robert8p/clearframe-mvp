name: Temporary Cogni 0.3.1 APK validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-hotfix-apk-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Download hotfix APK
        run: curl -fL --retry 3 --retry-delay 2 -o /tmp/cogni-0.3.1.apk 'https://expo.dev/artifacts/eas/aEBx00T0OgRORLMF_9563VlEEvq-45itbJOTdhIM21E.apk'
      - name: Verify package, version, permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/cogni-0.3.1.apk >/dev/null
          SHA=$(sha256sum /tmp/cogni-0.3.1.apk | awk '{print $1}')
          SIZE=$(stat -c%s /tmp/cogni-0.3.1.apk)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          BADGING=$($AAPT dump badging /tmp/cogni-0.3.1.apk)
          echo "$BADGING" | grep -q "package: name='app.gocogni.cogni'"
          echo "$BADGING" | grep -q "versionName='0.3.1'"
          echo "$BADGING" | grep -q "application-label:'Cogni'"
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          PERMS=$($AAPT dump permissions /tmp/cogni-0.3.1.apk)
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          ! echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          ! echo "$PERMS" | grep -q 'android.permission.READ_EXTERNAL_STORAGE'
          ! echo "$PERMS" | grep -q 'android.permission.WRITE_EXTERNAL_STORAGE'
          SIGNATURE=$($APKSIGNER verify --verbose --print-certs /tmp/cogni-0.3.1.apk)
          echo "$SIGNATURE" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          SIGNER_SHA=$(echo "$SIGNATURE" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-Z' 'a-z')
          EXPECTED_SIGNER='e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e'
          [ "$SIGNER_SHA" = "$EXPECTED_SIGNER" ]
          {
            echo '# Cogni 0.3.1 APK binary verification'
            echo
            echo '- status: PASS'
            echo "- sha256: $SHA"
            echo "- size_bytes: $SIZE"
            echo '- package: app.gocogni.cogni'
            echo '- version_name: 0.3.1'
            echo "- version_code: $VERSION_CODE"
            echo '- apk_v2_signature: true'
            echo "- signer_sha256: $SIGNER_SHA"
            echo '- blocked_overlay_permission_absent: true'
            echo '- blocked_legacy_storage_permissions_absent: true'
            echo '- internet_permission_present: true'
            echo '- eas_build_id: 2f87a498-a79e-4b97-ba5c-b2ecc51d8219'
          } > APK_0.3.1_VERIFICATION.md
      - name: Publish verification result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APK_0.3.1_VERIFICATION.md
          git commit -m 'Record Cogni 0.3.1 APK binary verification'
          git push origin HEAD:main
