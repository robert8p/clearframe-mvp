name: Cogni v0.4.0 bootstrap

on:
  push:
    branches: [feat/cogni-0.4.0-monetisation]

permissions:
  contents: write

jobs:
  patch-and-lock:
    if: github.event.head_commit.message != 'Apply Cogni 0.4.0 bootstrap patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cogni-0.4.0-monetisation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Patch server routes with assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/mobile-api/index.ts')
          text = path.read_text()

          import_anchor = '} from "./engine.ts";\n'
          import_block = '''} from "./engine.ts";\nimport {\n  BillingUnavailableError,\n  PremiumRequiredError,\n  loadEntitlementState,\n  recordMonetizationAnalytics,\n  requirePro,\n  syncFromRevenueCat,\n} from "./monetization.ts";\n'''
          if './monetization.ts' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Expected exactly one engine import anchor')
              text = text.replace(import_anchor, import_block, 1)

          route_anchor = '''    } else if (path === "/api/mobile/context-feedback" && method === "POST") {\n      result = await contextFeedback(admin, user, envelope.body);\n    } else if (path.startsWith("/api/mobile/practice/") && method === "GET") {\n'''
          route_block = '''    } else if (path === "/api/mobile/context-feedback" && method === "POST") {\n      result = await contextFeedback(admin, user, envelope.body);\n    } else if (path === "/api/mobile/entitlements" && method === "GET") {\n      result = await loadEntitlementState(admin, user.id);\n    } else if (path === "/api/mobile/entitlements/sync" && method === "POST") {\n      result = await syncFromRevenueCat(admin, user.id);\n    } else if (path === "/api/mobile/analytics" && method === "POST") {\n      result = await recordMonetizationAnalytics(admin, user.id, envelope.body);\n    } else if (path.startsWith("/api/mobile/practice/") && method === "GET") {\n      await requirePro(admin, user.id, "focused_practice");\n'''
          if '/api/mobile/entitlements' not in text:
              if text.count(route_anchor) != 1:
                  raise SystemExit('Expected exactly one practice route anchor')
              text = text.replace(route_anchor, route_block, 1)

          answer_anchor = '''  if (mode !== "diagnostic" && mode !== "training" && mode !== "practice") throw new HttpError(400, "Answer mode is invalid.");\n  const responseTimeMs = requiredInt(input.responseTimeMs, 0, 3600000, "Response time");\n'''
          answer_block = '''  if (mode !== "diagnostic" && mode !== "training" && mode !== "practice") throw new HttpError(400, "Answer mode is invalid.");\n  if (mode === "practice") await requirePro(admin, user.id, "focused_practice");\n  const responseTimeMs = requiredInt(input.responseTimeMs, 0, 3600000, "Response time");\n'''
          if 'if (mode === "practice") await requirePro' not in text:
              if text.count(answer_anchor) != 1:
                  raise SystemExit('Expected exactly one practice answer anchor')
              text = text.replace(answer_anchor, answer_block, 1)

          catch_anchor = '''  } catch (error) {\n    if (error instanceof HttpError) return response({ error: error.message }, error.status);\n    const message = error instanceof Error ? error.message : String(error);\n'''
          catch_block = '''  } catch (error) {\n    if (error instanceof PremiumRequiredError) return response({ error: { code: error.code, message: error.message, details: { feature: error.feature } } }, error.status);\n    if (error instanceof BillingUnavailableError) return response({ error: { code: error.code, message: error.message } }, error.status);\n    if (error instanceof HttpError) return response({ error: error.message }, error.status);\n    if (error instanceof Error && error.message === "invalid_monetization_event") return response({ error: { code: "invalid_request", message: "Invalid analytics event." } }, 400);\n    const message = error instanceof Error ? error.message : String(error);\n'''
          if 'error instanceof PremiumRequiredError' not in text:
              if text.count(catch_anchor) != 1:
                  raise SystemExit('Expected exactly one error catch anchor')
              text = text.replace(catch_anchor, catch_block, 1)

          path.write_text(text)
          PY

      - name: Pin RevenueCat SDK and regenerate lockfile
        working-directory: mobile
        run: npm install react-native-purchases@10.7.2 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/mobile-api/index.ts mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'No bootstrap changes required.'
            exit 0
          fi
          git commit -m 'Apply Cogni 0.4.0 bootstrap patch'
          git push origin HEAD:feat/cogni-0.4.0-monetisation
