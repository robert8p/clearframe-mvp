name: Temporary mobile UI fix status

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Wait for build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="022cfe7b-1ccd-4ebd-bc05-a01a0080d637"
          for attempt in $(seq 1 12); do
            npx eas-cli@21.7.1 build:view "$BUILD_ID" --json > /tmp/eas-build.json
            cat /tmp/eas-build.json
            STATUS=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8")); process.stdout.write(j.status)')
            if [ "$STATUS" = "FINISHED" ]; then exit 0; fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
            sleep 45
          done
          exit 1
