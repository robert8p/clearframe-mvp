name: Temporary Cogni 0.3.0 APK validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-casual-apk-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: curl -fL --retry 3 --retry-delay 2 -o /tmp/cogni.apk 'https://expo.dev/artifacts/eas/iuCTCojIozLASKOTbLEXS7kQO6bwYaHwsxqwCunUa3U.apk'
      - name: Verify archive, identity, permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/cogni.apk >/dev/null
          echo "APK archive integrity: PASS"
          echo "APK size: $(du -h /tmp/cogni.apk | cut -f1)"
          echo "APK_SHA256=$(sha256sum /tmp/cogni.apk | awk '{print $1}')"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          BADGING=$($AAPT dump badging /tmp/cogni.apk)
          echo "$BADGING" | head -12
          echo "$BADGING" | grep -q "package: name='app.gocogni.cogni'"
          echo "$BADGING" | grep -q "versionCode='2'"
          echo "$BADGING" | grep -q "versionName='0.3.0'"
          echo "$BADGING" | grep -q "application-label:'Cogni'"
          PERMS=$($AAPT dump permissions /tmp/cogni.apk)
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          echo "$PERMS" | grep -q 'android.permission.VIBRATE'
          ! echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          ! echo "$PERMS" | grep -q 'android.permission.READ_EXTERNAL_STORAGE'
          ! echo "$PERMS" | grep -q 'android.permission.WRITE_EXTERNAL_STORAGE'
          SIGNATURE=$($APKSIGNER verify --verbose --print-certs /tmp/cogni.apk)
          echo "$SIGNATURE"
          echo "$SIGNATURE" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          echo "$SIGNATURE" | grep -q 'e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e'
          echo "Cogni 0.3.0 APK validation: PASS"
