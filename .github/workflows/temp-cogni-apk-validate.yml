name: Temporary Cogni APK validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: curl -fL --retry 3 --retry-delay 2 -o /tmp/cogni.apk 'https://expo.dev/artifacts/eas/w_ZZVGu2oD3nlLB9A9k1WxLqyG7BiBJcExbipm2oU_I.apk'
      - name: Verify archive and identity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/cogni.apk >/dev/null
          echo "APK archive integrity: PASS"
          echo "APK size: $(du -h /tmp/cogni.apk | cut -f1)"
          echo "APK_SHA256=$(sha256sum /tmp/cogni.apk | awk '{print $1}')"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          BADGING=$($AAPT dump badging /tmp/cogni.apk)
          echo "$BADGING" | head -12
          echo "$BADGING" | grep -q "package: name='app.gocogni.cogni'"
          echo "$BADGING" | grep -q "application-label:'Cogni'"
          PERMS=$($AAPT dump permissions /tmp/cogni.apk)
          echo "$PERMS"
          ! echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          ! echo "$PERMS" | grep -q 'android.permission.READ_EXTERNAL_STORAGE'
          ! echo "$PERMS" | grep -q 'android.permission.WRITE_EXTERNAL_STORAGE'
          $APKSIGNER verify --verbose --print-certs /tmp/cogni.apk
          echo "Cogni APK validation: PASS"
