name: Discover Cogni 0.3.2 verification run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-discover-cogni-0.3.2-run.yml"

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 5b21dbcc2d70f641ce08f51c32cd8f4e3fcd30fd
      TARGET_WORKFLOW: Cogni 0.3.2 clean rebuild and runtime verification
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ github.token }}

      - name: Discover run and current jobs
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=30" \
            > /tmp/runs.json

          node <<'NODE' > /tmp/selected-run.json
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const run = (data.workflow_runs ?? [])
            .filter((item) => item?.name === process.env.TARGET_WORKFLOW && item?.event === 'push')
            .sort((a, b) => String(b.created_at ?? '').localeCompare(String(a.created_at ?? '')))[0] ?? null;
          process.stdout.write(JSON.stringify(run));
          NODE

          FOUND=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(j?'yes':'no')")
          if [ "$FOUND" = "no" ]; then
            cat > REBUILD_0.3.2_LIVE_STATUS.md <<EOF
          # Cogni 0.3.2 verification live status

          - status: RUN_NOT_FOUND
          - source_commit: $TARGET_SHA
          EOF
          else
            RUN_ID=$(node -e "const j=require('/tmp/selected-run.json');process.stdout.write(String(j.id))")
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/jobs.json

            node <<'NODE' > REBUILD_0.3.2_LIVE_STATUS.md
            const fs = require('fs');
            const run = JSON.parse(fs.readFileSync('/tmp/selected-run.json', 'utf8'));
            const jobs = JSON.parse(fs.readFileSync('/tmp/jobs.json', 'utf8')).jobs ?? [];
            const lines = [
              '# Cogni 0.3.2 verification live status',
              '',
              `- run_id: ${run.id}`,
              `- status: ${run.status}`,
              `- conclusion: ${run.conclusion ?? ''}`,
              `- source_commit: ${run.head_sha}`,
              `- created_at: ${run.created_at}`,
              `- updated_at: ${run.updated_at}`,
              '',
              '## Jobs',
              ''
            ];
            for (const job of jobs) lines.push(`- ${job.name}: ${job.status}${job.conclusion ? ` / ${job.conclusion}` : ''} (job_id ${job.id})`);
            lines.push('');
            process.stdout.write(lines.join('\n'));
            NODE
          fi

      - name: Publish live status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REBUILD_0.3.2_LIVE_STATUS.md
          git commit -m 'Record live Cogni 0.3.2 verification status'
          git push origin HEAD:main
