name: Apply verified Cogni UX source

on:
  push:
    branches: [fix/cogni-ux-quality-20260906]
    paths: ['.github/workflows/cogni-ux-apply-once.yml']

permissions:
  contents: read

concurrency:
  group: cogni-ux-apply-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/cogni-ux-quality-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact hash-verified edits, never overwrite concurrent changes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          manifests = sorted(root.glob('.github/ux-edits/part-*.json'))
          assert len(manifests) == 4, 'Expected all four change manifests'
          entries = [entry for manifest in manifests for entry in json.loads(manifest.read_text())]
          assert len(entries) == 43, 'Unexpected change set size'
          pending = []
          seen = set()
          for entry in entries:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert str(relative).startswith(('mobile/', 'app/', 'components/', 'lib/', '.github/scripts/'))
              assert str(relative) not in seen, 'Duplicate destination'
              seen.add(str(relative))
              destination = root / relative
              assert not destination.is_symlink(), 'Refuse symlink destination'
              old = destination.read_bytes() if destination.exists() else None
              actual = hashlib.sha256(old).hexdigest() if old is not None else None
              assert actual == entry['before'], f'Concurrent source change: {relative}'
              if 'content' in entry:
                  updated = entry['content']
              else:
                  updated = old.decode('utf-8')
                  previous = len(updated) + 1
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(updated) and end < previous
                      updated = updated[:start] + replacement + updated[end:]
                      previous = start
              output = updated.encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['after'], f'Output checksum mismatch: {relative}'
              pending.append((destination, output))
          for destination, output in pending:
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(output)
          evidence = pathlib.Path('/tmp/cogni-ux-evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'source-manifest.json').write_text(json.dumps(entries, indent=2))
          for manifest in manifests:
              manifest.unlink()
          print(f'Applied and verified {len(pending)} files; no backend schema or entitlement implementation changed.')
          PY
          git diff --check
      - name: Commit exact materialized source to fix branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mobile app components lib .github/scripts .github/ux-edits
          git commit -m 'fix: complete Cogni copy, primary training action and race-safe feedback'
          git push origin HEAD:fix/cogni-ux-quality-20260906
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/cogni-ux-evidence/source-sha.txt
          git archive --format=tar --output=/tmp/cogni-ux-evidence/source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-ux-materialized-source
          path: /tmp/cogni-ux-evidence/
          retention-days: 14

  mobile:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.materialize.outputs.source }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Lint, behavioral tests, security audits and types
        working-directory: mobile
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee /tmp/cogni-mobile-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-ux-mobile-validation
          path: /tmp/cogni-mobile-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  web:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.materialize.outputs.source }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install web dependencies without changing the manifest
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Web production build and lint
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/cogni-web-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cogni-ux-web-validation
          path: /tmp/cogni-web-build.txt
          if-no-files-found: ignore
          retention-days: 14
