name: Temporary Cogni 0.3.1 signer recheck

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-hotfix-signer-recheck.yml"

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Recheck signing identity
        shell: bash
        run: |
          set -euo pipefail
          URL='https://expo.dev/artifacts/eas/aEBx00T0OgRORLMF_9563VlEEvq-45itbJOTdhIM21E.apk'
          APK=/tmp/cogni-0.3.1.apk
          curl -fL --retry 3 --retry-delay 2 -o "$APK" "$URL"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          RAW=$($APKSIGNER verify --verbose --print-certs "$APK" 2>&1)
          EXPECTED='e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e'
          NORMALIZED=$(printf '%s\n' "$RAW" | tr 'A-Z' 'a-z' | tr -d ':[:space:]')
          MATCH=false
          if printf '%s' "$NORMALIZED" | grep -q "$EXPECTED"; then MATCH=true; fi
          {
            echo '# Cogni 0.3.1 signing certificate recheck'
            echo
            echo "- apk_v2_signature_valid: $(printf '%s\n' "$RAW" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' && echo true || echo false)"
            echo "- expected_signer_present: $MATCH"
            echo "- expected_signer_sha256: $EXPECTED"
            echo '- eas_build_id: 2f87a498-a79e-4b97-ba5c-b2ecc51d8219'
          } > APK_0.3.1_SIGNER_RECHECK.md
      - name: Publish signer recheck
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APK_0.3.1_SIGNER_RECHECK.md
          git commit -m 'Record Cogni 0.3.1 signer recheck'
          git push origin HEAD:main
