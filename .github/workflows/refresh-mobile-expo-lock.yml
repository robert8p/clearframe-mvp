name: Refresh mobile Expo lock

on:
  push:
    branches: [feature/contextual-situation-engine]
    paths:
      - ".github/workflows/refresh-mobile-expo-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/contextual-situation-engine
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - name: Align Expo patch version and lockfile
        working-directory: mobile
        run: npm install 'expo@~54.0.37' --save --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Align Expo dependency with SDK 54"
          git push origin HEAD:feature/contextual-situation-engine
