name: EAS Android preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Link existing Expo project
        run: npx eas-cli@latest init --account cogniapp --force --json --non-interactive

      - name: Verify EAS project ID was persisted
        run: |
          node -e 'const c=require("./app.json"); const id=c.expo?.extra?.eas?.projectId; if(!id){console.error("EAS project ID was not written to app.json"); process.exit(1)} console.log(`Linked EAS project: ${id}`)'

      - name: Persist Expo project link to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Expo EAS project link"
            git push origin HEAD:main
          fi

      - name: Start installable Android preview build
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
