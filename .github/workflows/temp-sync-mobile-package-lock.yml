name: Temporary mobile package-lock synchroniser

on:
  push:
    branches:
      - feat/cogni-0.4.0-monetisation
    paths:
      - mobile/package.json

permissions:
  contents: write

concurrency:
  group: cogni-mobile-lock-sync
  cancel-in-progress: true

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cogni-0.4.0-monetisation
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate the exact npm lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit only a changed package-lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Sync mobile package lock for feedback dependencies"
          git push origin HEAD:feat/cogni-0.4.0-monetisation
