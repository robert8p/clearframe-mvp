name: Expo mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "supabase/functions/mobile-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "supabase/functions/mobile-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strict install
        run: npm ci --include=dev --no-audit --no-fund
      - name: Expo dependency check
        run: npx expo install --check
      - name: ESLint
        run: npm run lint
      - name: UI quality audit
        run: npm run ui-audit
      - name: Logic and security audit
        run: npm run logic-audit
      - name: TypeScript
        run: npm run typecheck
      - name: Supabase Edge typecheck
        working-directory: .
        run: deno check supabase/functions/mobile-api/index.ts
      - name: Context engine behavioral tests
        working-directory: .
        run: deno test supabase/functions/mobile-api/engine_test.ts
