name: Finalise stakeholder hardening implementation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalise-stakeholder-review.yml"

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require prepared stakeholder tree
        run: test -f STAKEHOLDER_REVIEW.md
      - name: Apply final interaction, recovery and type-safety fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > mobile/components/info-screen.tsx <<'EOF'
          import React from "react";
          import { Text, View } from "react-native";
          import { Body, Card, Eyebrow, Screen, Title } from "@/components/ui";
          import { colors } from "@/lib/theme";

          export function InfoSection({ title, body }: { title: string; body: string }) {
            return <Card><Title size={21}>{title}</Title><Body muted>{body}</Body></Card>;
          }

          export function InfoScreen({ eyebrow, title, intro, children }: { eyebrow: string; title: string; intro: string; children: React.ReactNode }) {
            return <Screen><View style={{ gap: 6 }}><Eyebrow>{eyebrow}</Eyebrow><Title size={30}>{title}</Title><Body muted>{intro}</Body></View>{children}<Text style={{ color: colors.soft, fontSize: 12.5, lineHeight: 18 }}>Cogni internal alpha · Information last reviewed 13 August 2026</Text></Screen>;
          }
          EOF

          cat > mobile/app/help.tsx <<'EOF'
          import React, { useEffect } from "react";
          import { router } from "expo-router";
          import { View } from "react-native";
          import { InfoScreen, InfoSection } from "@/components/info-screen";
          import { CompactAction } from "@/components/interaction-cues";
          import { trackEvent } from "@/lib/analytics";

          export default function HelpScreen() {
            useEffect(() => { void trackEvent("help_opened"); }, []);
            return <InfoScreen eyebrow="Help & support" title="Get unstuck without losing progress" intro="Cogni stores completed answers and can resume unfinished daily sessions.">
              <InfoSection title="What the numbers mean" body="A skill score is a current estimate, not a fixed grade. Evidence level tells you how much history sits behind it. XP and streak reward learning activity and do not directly raise a skill score." />
              <InfoSection title="Session interrupted" body="Return Home or Train and reopen today’s activity. Cogni should continue from the next unanswered item." />
              <InfoSection title="Something feels irrelevant" body="Complete the session, then use Session feedback to rate relevance or difficulty. Feedback improves future content and never changes your score." />
              <InfoSection title="Need a person?" body="Send enough detail to reproduce the problem, but never include passwords or sensitive information." />
              <View style={{ gap: 8 }}><CompactAction accent label="Contact support" onPress={() => router.push("/support")} /><CompactAction label="Rate latest session" onPress={() => router.push("/feedback")} /><CompactAction label="Account & data" onPress={() => router.push("/account")} /></View>
            </InfoScreen>;
          }
          EOF

          cat > mobile/app/privacy.tsx <<'EOF'
          import React from "react";
          import { InfoScreen, InfoSection } from "@/components/info-screen";
          export default function PrivacyScreen() { return <InfoScreen eyebrow="Privacy notice · internal alpha" title="Your learning data should help you, not surprise you" intro="Last updated 13 August 2026. This operational alpha notice describes the current Cogni service."><InfoSection title="Data Cogni uses" body="Account details, chosen learning context, answers, confidence, response time, score updates, lesson and session history, XP, streak, feedback, support requests and limited product events." /><InfoSection title="Why" body="To sign you in, resume sessions, personalise examples, calculate and explain adaptive skill estimates, improve content, answer support requests and protect the service." /><InfoSection title="Scores and automation" body="Development Scores are adaptive estimates based on current evidence. They are not qualifications, diagnoses, psychometric certifications or suitable as the sole basis for a high-stakes education or employment decision." /><InfoSection title="Organisation reporting" body="Aggregate reporting does not require permission to show an individual profile. Any individual reporting is controlled per organisation from Profile and must be explained under the organisation’s pilot terms." /><InfoSection title="Your controls" body="Change optional profile details, change learning context, export your data or delete the account from Profile → Account & data. Use Help & support for access, correction or privacy questions." /><InfoSection title="Security and providers" body="Cogni uses Supabase for authentication/database services and Vercel for hosting. Credentials remain server-side. Do not enter passwords or sensitive information in feedback." /></InfoScreen>; }
          EOF

          cat > mobile/app/terms.tsx <<'EOF'
          import React from "react";
          import { InfoScreen, InfoSection } from "@/components/info-screen";
          export default function TermsScreen() { return <InfoScreen eyebrow="Terms of use · internal alpha" title="Use Cogni as a learning tool, not an unquestionable authority" intro="Last updated 13 August 2026. Features and content may change during the alpha."><InfoSection title="What Cogni provides" body="Short learning activities, adaptive practice, explanations and progress estimates intended to strengthen judgement and critical thinking." /><InfoSection title="What Cogni does not provide" body="Cogni is not legal, medical, financial, employment or other regulated professional advice. Scores are not qualifications, diagnoses or guarantees of real-world performance." /><InfoSection title="Your account" body="Keep credentials confidential, do not access another user’s data and do not attempt to expose answer keys or disrupt the service." /><InfoSection title="Organisations" body="An organisation pilot requires separate terms for administration, reporting, learner transparency, retention and privacy. Joining an organisation does not automatically enable individual reporting." /><InfoSection title="Ending use" body="You may stop using Cogni at any time and can permanently delete your account from Profile → Account & data." /></InfoScreen>; }
          EOF

          cat > mobile/components/support-form.tsx <<'EOF'
          import React, { useState } from "react";
          import { Pressable, Text, View } from "react-native";
          import { FormField } from "@/components/form-field";
          import { trackEvent } from "@/lib/analytics";
          import { apiFetch } from "@/lib/api";
          import { colors } from "@/lib/theme";
          import { PrimaryButton } from "@/components/ui";

          const categories = [["general", "General help"], ["technical", "Technical issue"], ["content", "Learning content"], ["privacy", "Privacy or data"], ["account_deletion", "Account deletion"], ["accessibility", "Accessibility"], ["enterprise", "Organisation or pilot"]] as const;
          type Category = typeof categories[number][0];

          export function SupportForm({ initialCategory = "general" }: { initialCategory?: Category }) {
            const [category, setCategory] = useState<Category>(initialCategory); const [message, setMessage] = useState(""); const [busy, setBusy] = useState(false); const [error, setError] = useState(""); const [sent, setSent] = useState(false);
            async function submit() { if (busy || message.trim().length < 10) return; setBusy(true); setError(""); setSent(false); try { await apiFetch("/api/support", { method: "POST", body: JSON.stringify({ category, message: message.trim(), platform: "android", appVersion: "0.2.0" }) }); setSent(true); setMessage(""); await trackEvent("support_request_submitted", { category }); } catch (caught) { setError(caught instanceof Error ? caught.message : "Could not send your request."); } finally { setBusy(false); } }
            return <View style={{ gap: 14 }}><View accessibilityRole="radiogroup" style={{ gap: 8 }}><Text style={{ color: colors.text, fontSize: 15, fontWeight: "900" }}>Request type</Text><View style={{ flexDirection: "row", flexWrap: "wrap", gap: 8 }}>{categories.map(([value, label]) => { const selected = category === value; return <Pressable accessibilityRole="radio" accessibilityState={{ selected }} accessibilityLabel={label} onPress={() => setCategory(value)} key={value} style={({ pressed }) => ({ minHeight: 48, justifyContent: "center", backgroundColor: selected ? "rgba(0,229,255,.12)" : colors.panel2, borderWidth: 1, borderColor: selected ? colors.cyan : colors.lineStrong, borderRadius: 14, paddingHorizontal: 12, paddingVertical: 12, opacity: pressed ? .78 : 1 })}><Text style={{ color: colors.text, fontWeight: "800" }}>{label}</Text></Pressable>; })}</View></View><FormField label="What happened or what do you need?" hint="Do not include passwords or sensitive information." multiline maxLength={2000} value={message} onChangeText={setMessage} placeholder="Include the screen, action and what you expected." placeholderTextColor={colors.soft} />{error ? <Text accessibilityLiveRegion="assertive" style={{ color: colors.danger, lineHeight: 22 }}>{error}</Text> : null}{sent ? <Text accessibilityLiveRegion="polite" style={{ color: colors.green, lineHeight: 22, fontWeight: "800" }}>Request received.</Text> : null}<PrimaryButton label={busy ? "Sending…" : "Send request"} disabled={busy || message.trim().length < 10} onPress={() => void submit()} /></View>;
          }
          EOF

          cat > mobile/app/support.tsx <<'EOF'
          import React, { useEffect } from "react";
          import { View } from "react-native";
          import { trackEvent } from "@/lib/analytics";
          import { SupportForm } from "@/components/support-form";
          import { Body, Card, Eyebrow, Screen, Title } from "@/components/ui";

          export default function SupportScreen() {
            useEffect(() => { void trackEvent("help_opened", { destination: "support" }); }, []);
            return <Screen><View style={{ gap: 6 }}><Eyebrow>Contact support</Eyebrow><Title size={30}>Tell us what happened</Title><Body muted>Include enough detail to reproduce the issue, but do not include passwords, authentication codes or sensitive personal information.</Body></View><Card><SupportForm /></Card></Screen>;
          }
          EOF

          cat > mobile/app/signup.tsx <<'EOF'
          import React, { useRef, useState } from "react";
          import { router } from "expo-router";
          import { Pressable, Text, View } from "react-native";
          import type { TextInput } from "react-native";
          import { CogniLogo } from "@/components/brand";
          import { FormField } from "@/components/form-field";
          import { CompactAction } from "@/components/interaction-cues";
          import { Body, Card, PrimaryButton, Screen, Title } from "@/components/ui";
          import { supabase } from "@/lib/supabase";
          import { colors } from "@/lib/theme";

          const WEB_URL = (process.env.EXPO_PUBLIC_WEB_URL ?? process.env.EXPO_PUBLIC_API_URL ?? "https://gocogni.vercel.app").replace(/\/$/, "");

          export default function SignupScreen() {
            const emailRef = useRef<TextInput>(null); const passwordRef = useRef<TextInput>(null); const [email, setEmail] = useState(""); const [password, setPassword] = useState(""); const [name, setName] = useState(""); const [busy, setBusy] = useState(false); const [message, setMessage] = useState(""); const [error, setError] = useState(""); const [accepted, setAccepted] = useState(false);
            async function submit() { if (busy || !accepted) return; setBusy(true); setError(""); setMessage(""); try { const { data, error: authError } = await supabase.auth.signUp({ email: email.trim(), password, options: { data: { full_name: name.trim() || undefined }, emailRedirectTo: `${WEB_URL}/login` } }); if (authError) { setError(authError.message.toLowerCase().includes("already") ? "An account may already exist for this email. Try signing in or resetting the password." : authError.message); return; } if (data.session) router.replace("/onboarding"); else setMessage("Account created. Confirm the email from Cogni, then return to this app and sign in."); } catch { setError("Connection interrupted. Check your connection and try again."); } finally { setBusy(false); } }
            return <Screen contentStyle={{ flexGrow: 1, justifyContent: "center", gap: 18 }}><View style={{ alignItems: "center" }}><CogniLogo centered /></View><Card><Title size={30}>Create your Cogni account</Title><Body muted>Your skill profile, streak and progress will stay synced across devices.</Body><View style={{ gap: 14 }}><FormField label="Name" returnKeyType="next" value={name} onChangeText={setName} onSubmitEditing={() => emailRef.current?.focus()} placeholder="Your name" placeholderTextColor={colors.soft} /><FormField ref={emailRef} label="Email" autoCapitalize="none" autoComplete="email" keyboardType="email-address" returnKeyType="next" value={email} onChangeText={setEmail} onSubmitEditing={() => passwordRef.current?.focus()} placeholder="you@example.com" placeholderTextColor={colors.soft} /><FormField ref={passwordRef} label="Password" hint="At least 8 characters" secureTextEntry autoCapitalize="none" autoComplete="new-password" returnKeyType="done" value={password} onChangeText={setPassword} onSubmitEditing={() => void submit()} placeholder="At least 8 characters" placeholderTextColor={colors.soft} /></View><Pressable accessibilityRole="checkbox" accessibilityState={{ checked: accepted }} accessibilityLabel="Agree to the Terms of use and acknowledge the Privacy notice" onPress={() => setAccepted((value) => !value)} style={({ pressed }) => ({ minHeight: 48, flexDirection: "row", alignItems: "center", gap: 11, opacity: pressed ? .76 : 1 })}><View accessible={false} style={{ width: 24, height: 24, borderRadius: 7, borderWidth: 2, borderColor: accepted ? colors.cyan : colors.lineStrong, backgroundColor: accepted ? "rgba(0,229,255,.16)" : "transparent", alignItems: "center", justifyContent: "center" }}>{accepted ? <Text style={{ color: colors.cyan, fontWeight: "900" }}>✓</Text> : null}</View><Text style={{ flex: 1, color: colors.text, fontSize: 14, lineHeight: 20, fontWeight: "700" }}>I agree to the Terms of use and acknowledge the Privacy notice.</Text></Pressable><View style={{ flexDirection: "row", flexWrap: "wrap", gap: 8 }}><CompactAction label="Read privacy notice" onPress={() => router.push("/privacy")} /><CompactAction label="Read terms" onPress={() => router.push("/terms")} /></View>{error ? <Text accessibilityLiveRegion="assertive" selectable style={{ color: colors.danger, lineHeight: 22 }}>{error}</Text> : null}{message ? <Text accessibilityLiveRegion="polite" selectable style={{ color: colors.green, lineHeight: 22 }}>{message}</Text> : null}<PrimaryButton label={busy ? "Creating account…" : "Create account"} disabled={busy || !email || password.length < 8 || !accepted} onPress={() => void submit()} /></Card></Screen>;
          }
          EOF

          cat > components/AuthForm.tsx <<'EOF'
          "use client";

          import { FormEvent, useState } from "react";
          import Link from "next/link";
          import { useRouter } from "next/navigation";
          import { createClient } from "@/lib/supabase/client";

          export function AuthForm({ mode }: { mode: "login" | "signup" }) {
            const router = useRouter(); const [email, setEmail] = useState(""); const [password, setPassword] = useState(""); const [fullName, setFullName] = useState(""); const [accepted, setAccepted] = useState(false); const [busy, setBusy] = useState(false); const [error, setError] = useState(""); const [message, setMessage] = useState("");
            async function submit(event: FormEvent<HTMLFormElement>) {
              event.preventDefault(); if (busy || (mode === "signup" && !accepted)) return; setBusy(true); setError(""); setMessage("");
              try { const supabase = createClient(); if (mode === "login") { const { error: authError } = await supabase.auth.signInWithPassword({ email: email.trim(), password }); if (authError) throw authError; router.push("/dashboard"); router.refresh(); } else { const { data, error: authError } = await supabase.auth.signUp({ email: email.trim(), password, options: { data: { full_name: fullName.trim() || undefined }, emailRedirectTo: `${window.location.origin}/login` } }); if (authError) throw authError; if (data.session) { router.push("/onboarding"); router.refresh(); } else setMessage("Account created. Confirm the email from Cogni, then return to sign in."); } }
              catch (caught) { const raw = caught instanceof Error ? caught.message.toLowerCase() : ""; setError(raw.includes("invalid login") ? "The email or password is incorrect." : raw.includes("email not confirmed") ? "Confirm the email from Cogni before signing in." : caught instanceof Error ? caught.message : "Could not complete the request."); }
              finally { setBusy(false); }
            }
            return <form onSubmit={submit} style={{ display: "grid", gap: 12 }}>{mode === "signup" && <><label htmlFor="auth-name">Name</label><input id="auth-name" className="input" autoComplete="name" value={fullName} onChange={(event) => setFullName(event.target.value)} /></>}<label htmlFor="auth-email">Email</label><input id="auth-email" className="input" type="email" autoComplete="email" value={email} onChange={(event) => setEmail(event.target.value)} required /><label htmlFor="auth-password">Password</label><input id="auth-password" className="input" type="password" minLength={8} autoComplete={mode === "login" ? "current-password" : "new-password"} value={password} onChange={(event) => setPassword(event.target.value)} required />{mode === "signup" && <label style={{ display: "flex", alignItems: "flex-start", gap: 10 }}><input type="checkbox" checked={accepted} onChange={(event) => setAccepted(event.target.checked)} /><span>I agree to the <Link href="/terms">Terms</Link> and acknowledge the <Link href="/privacy">Privacy notice</Link>.</span></label>}{error && <p role="alert" className="cg-auth-message error">{error}</p>}{message && <p aria-live="polite" className="cg-auth-message success">{message}</p>}<button className="cg-button cg-full" disabled={busy || !email || password.length < 8 || (mode === "signup" && !accepted)}>{busy ? "Working…" : mode === "login" ? "Sign in" : "Create account"}</button>{mode === "login" && <Link href="/forgot-password">Forgot password?</Link>}<p>{mode === "login" ? <>New to Cogni? <Link href="/signup">Create an account</Link></> : <>Already have an account? <Link href="/login">Sign in</Link></>}</p></form>;
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/scripts/ui-audit.mjs')
          s=p.read_text()
          s=s.replace('if (/<Text\\b[^>]*\\bonPress=/.test(source)&&!relative.endsWith("support-form.tsx"))failures.push(`${relative} uses Text.onPress outside the audited radio-chip support control.`);','if (/<Text\\b[^>]*\\bonPress=/.test(source)) failures.push(`${relative} uses Text.onPress; use Pressable so the hit target and role are explicit.`);')
          p.write_text(s)
          PY

          rm .github/workflows/finalise-stakeholder-review.yml
          git config user.name "Cogni QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalise stakeholder review implementation"
          git push origin HEAD:main
