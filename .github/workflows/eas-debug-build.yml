name: EAS check replacement Android build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-debug-build.yml"

jobs:
  check-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: "4fabb187-08fc-4f82-a6dd-1c3913d1738a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check replacement build status
        working-directory: mobile
        run: |
          npx eas-cli@latest build:view "$BUILD_ID" --json > /tmp/build.json
          cat /tmp/build.json
          STATUS=$(node -e 'const b=require("/tmp/build.json"); console.log(String(b.status || "").toUpperCase())')
          echo "STATUS=$STATUS"
          if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
            URL=$(node -e 'const b=require("/tmp/build.json"); console.log(b.logFiles?.[0] || "")')
            if [ -n "$URL" ]; then
              curl --compressed -fsSL "$URL" -o /tmp/eas-build.log
              echo "===== EAS BUILD LOG ====="
              cat /tmp/eas-build.log
            fi
            exit 1
          fi
