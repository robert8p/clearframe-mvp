name: Generate Expo mobile lockfile

on:
  push:
    branches: [main]
    paths:
      - "mobile/package.json"
      - ".github/workflows/mobile-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify strict install
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Verify native TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Persist lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Expo mobile dependencies"
            git push origin HEAD:main
          fi
