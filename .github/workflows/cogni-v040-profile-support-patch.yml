name: Cogni v0.4.0 profile support patch
on:
  push:
    branches: [feat/cogni-0.4.0-monetisation]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Cogni 0.4.0 Profile support patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cogni-0.4.0-monetisation
      - name: Add private support button with source assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('mobile/app/(tabs)/profile.tsx')
          text=path.read_text()
          anchor='''      <PrimaryButton label="Change password" secondary onPress={() => router.push({ pathname: "/auth/recovery", params: { source: "profile" } })} />\n'''
          if 'label="Cogni Support"' not in text:
              if text.count(anchor)!=1: raise SystemExit('Profile account action anchor mismatch')
              text=text.replace(anchor,'''      <PrimaryButton label="Cogni Support" secondary onPress={() => router.push("/support")} />\n'''+anchor,1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'mobile/app/(tabs)/profile.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Cogni 0.4.0 Profile support patch'
          git push origin HEAD:feat/cogni-0.4.0-monetisation
