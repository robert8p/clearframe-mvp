name: Temporary Cogni 0.3.0 build status

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Wait for build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="141e4d2c-2d9e-4117-8165-d2bce6873305"
          for attempt in $(seq 1 20); do
            echo "EAS status check $attempt/20"
            npx eas-cli@21.7.1 build:view "$BUILD_ID" --json > /tmp/eas-build.json
            cat /tmp/eas-build.json
            STATUS=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8")); process.stdout.write(j.status)')
            if [ "$STATUS" = "FINISHED" ]; then
              echo "BUILD_FINISHED"
              exit 0
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Build ended with status $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "Build did not finish within the polling window"
          exit 1
