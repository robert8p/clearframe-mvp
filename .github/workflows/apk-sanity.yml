name: Validate internal alpha APK binary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apk-sanity.yml"

permissions:
  contents: read

jobs:
  apk-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated EAS APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://expo.dev/artifacts/eas/TpunrmqElYHxhrC79J64g-xp7XNC-70HEtP6Pdw85I4.apk' \
            -o cogni.apk
          test -s cogni.apk
          ls -lh cogni.apk
          sha256sum cogni.apk
          file cogni.apk

      - name: Verify APK ZIP integrity
        run: unzip -t cogni.apk

      - name: Inspect Android package metadata
        run: |
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ] && [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          fi
          if [ -n "$APKANALYZER" ]; then
            echo "application-id=$($APKANALYZER manifest application-id cogni.apk)"
            echo "version-name=$($APKANALYZER manifest version-name cogni.apk)"
            echo "version-code=$($APKANALYZER manifest version-code cogni.apk)"
            echo "min-sdk=$($APKANALYZER manifest min-sdk cogni.apk)"
            echo "target-sdk=$($APKANALYZER manifest target-sdk cogni.apk)"
            echo "permissions:"
            $APKANALYZER manifest permissions cogni.apk
          else
            echo "apkanalyzer unavailable; ZIP and embedded endpoint checks still run."
          fi

      - name: Verify APK signature when apksigner is available
        run: |
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs cogni.apk
          else
            echo "apksigner unavailable on runner."
          fi

      - name: Verify production endpoints are embedded
        run: |
          rm -rf apk-unpacked
          unzip -q cogni.apk -d apk-unpacked
          grep -R -a -F 'https://gocogni.vercel.app' apk-unpacked >/dev/null
          grep -R -a -F 'https://dhklfrqhsmofqrawfdjz.supabase.co' apk-unpacked >/dev/null
          echo 'Verified Cogni production API and Supabase endpoints are present in the APK.'
