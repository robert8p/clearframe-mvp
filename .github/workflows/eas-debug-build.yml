name: EAS list recent Android builds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-debug-build.yml"

jobs:
  list-builds:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: List recent Android builds
        working-directory: mobile
        run: |
          npx eas-cli@21.7.1 build:list --platform android --limit 5 --json --non-interactive
