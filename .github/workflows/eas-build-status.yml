name: Check validated Android preview result

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-build-status.yml"

permissions:
  contents: read

jobs:
  build-status:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Read validated Android build
        working-directory: mobile
        run: npx eas-cli@21.7.1 build:view f5ac31df-3742-4cfb-979d-749c13fa3f61 --json
