name: Temporary Cogni 0.3.1 APK inspector

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-hotfix-apk-inspect.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Inspect hotfix APK and always write report
        shell: bash
        run: |
          set -u
          URL='https://expo.dev/artifacts/eas/aEBx00T0OgRORLMF_9563VlEEvq-45itbJOTdhIM21E.apk'
          APK=/tmp/cogni-0.3.1.apk
          DOWNLOAD=FAIL
          ARCHIVE=FAIL
          PACKAGE=UNKNOWN
          VERSION_NAME=UNKNOWN
          VERSION_CODE=UNKNOWN
          APP_LABEL=UNKNOWN
          V2_SIGNATURE=false
          SIGNER_SHA=UNKNOWN
          INTERNET=false
          OVERLAY_ABSENT=false
          LEGACY_STORAGE_ABSENT=false
          SHA=UNKNOWN
          SIZE=UNKNOWN
          if curl -fL --retry 3 --retry-delay 2 -o "$APK" "$URL"; then
            DOWNLOAD=PASS
            SHA=$(sha256sum "$APK" | awk '{print $1}')
            SIZE=$(stat -c%s "$APK")
            if unzip -t "$APK" >/dev/null 2>&1; then ARCHIVE=PASS; fi
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            BADGING=$($AAPT dump badging "$APK" 2>/dev/null || true)
            PACKAGE=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)
            VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
            APP_LABEL=$(echo "$BADGING" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -1)
            PERMS=$($AAPT dump permissions "$APK" 2>/dev/null || true)
            echo "$PERMS" | grep -q 'android.permission.INTERNET' && INTERNET=true
            if ! echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'; then OVERLAY_ABSENT=true; fi
            if ! echo "$PERMS" | grep -Eq 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then LEGACY_STORAGE_ABSENT=true; fi
            SIGNATURE=$($APKSIGNER verify --verbose --print-certs "$APK" 2>/dev/null || true)
            echo "$SIGNATURE" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' && V2_SIGNATURE=true
            SIGNER_SHA=$(echo "$SIGNATURE" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-Z' 'a-z')
            [ -n "$SIGNER_SHA" ] || SIGNER_SHA=UNKNOWN
          fi
          EXPECTED_SIGNER='e0bfda379dfa0e11aee798e443ce3b33d006d83b7857062f8f639ca7f7572c7e'
          OVERALL=PASS
          [ "$DOWNLOAD" = PASS ] || OVERALL=FAIL
          [ "$ARCHIVE" = PASS ] || OVERALL=FAIL
          [ "$PACKAGE" = 'app.gocogni.cogni' ] || OVERALL=FAIL
          [ "$VERSION_NAME" = '0.3.1' ] || OVERALL=FAIL
          [ "$APP_LABEL" = 'Cogni' ] || OVERALL=FAIL
          [ "$V2_SIGNATURE" = true ] || OVERALL=FAIL
          [ "$SIGNER_SHA" = "$EXPECTED_SIGNER" ] || OVERALL=FAIL
          [ "$INTERNET" = true ] || OVERALL=FAIL
          [ "$OVERLAY_ABSENT" = true ] || OVERALL=FAIL
          [ "$LEGACY_STORAGE_ABSENT" = true ] || OVERALL=FAIL
          {
            echo '# Cogni 0.3.1 APK binary inspection'
            echo
            echo "- overall: $OVERALL"
            echo "- download: $DOWNLOAD"
            echo "- archive_integrity: $ARCHIVE"
            echo "- sha256: $SHA"
            echo "- size_bytes: $SIZE"
            echo "- package: $PACKAGE"
            echo "- version_name: $VERSION_NAME"
            echo "- version_code: $VERSION_CODE"
            echo "- app_label: $APP_LABEL"
            echo "- apk_v2_signature: $V2_SIGNATURE"
            echo "- signer_sha256: $SIGNER_SHA"
            echo "- expected_signer_sha256: $EXPECTED_SIGNER"
            echo "- internet_permission_present: $INTERNET"
            echo "- overlay_permission_absent: $OVERLAY_ABSENT"
            echo "- legacy_storage_permissions_absent: $LEGACY_STORAGE_ABSENT"
            echo '- eas_build_id: 2f87a498-a79e-4b97-ba5c-b2ecc51d8219'
          } > APK_0.3.1_INSPECTION.md
      - name: Publish inspection report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APK_0.3.1_INSPECTION.md
          git commit -m 'Record Cogni 0.3.1 APK inspection'
          git push origin HEAD:main
