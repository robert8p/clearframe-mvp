name: Temporary Cogni 0.3.0 build check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-casual-build-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx eas-cli@21.7.1 build:view 141e4d2c-2d9e-4117-8165-d2bce6873305 --json
