name: EAS Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Strict mobile dependency install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: UI quality audit
        run: npm run ui-audit

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify Expo project link
        run: |
          node -e 'const c=require("./app.json"); const id=c.expo?.extra?.eas?.projectId; if(id!=="24fc0fea-5e66-4365-a82c-ac668aded7d0"){console.error(`Unexpected EAS project ID: ${id}`); process.exit(1)} console.log(`Linked EAS project: ${id}`)'

      - name: Start installable Android preview build
        run: npx eas-cli@21.7.1 build --platform android --profile preview --non-interactive --no-wait
